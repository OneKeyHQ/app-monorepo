[package]
name = "onekey-ble-pair"
version = "0.1.0"
edition = "2021"
description = "One-shot Windows BLE pairing helper for OneKey desktop (mirrors trezor-suite try_to_pair)"
publish = false

[[bin]]
name = "onekey-ble-pair"
path = "src/main.rs"

# WinRT projections. Only pulled on Windows targets; on macOS/Linux the crate
# compiles down to the non-windows stub in main.rs so `cargo build` still works
# during local development. Version pinned to match trezor-suite's transport-
# bluetooth crate, whose platform/windows.rs this is ported from.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Bluetooth",
    # Raw advertisement watcher: ground truth for "is the device advertising at
    # all, and under what address/UUIDs" — independent of noble's service-UUID
    # filter, which is a prime suspect for the "scan finds nothing" symptom.
    "Devices_Bluetooth_Advertisement",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_Com",
] }
# Minimal block_on so we can `.await` the WinRT async ops (like suite) instead
# of blocking the thread with `.get()`, which starved the PairingRequested
# delegate. No tokio — a single-purpose executor is enough here.
pollster = "0.4"
# `windows` pulls windows-future with default-features=false and only forwards
# std to windows-core, so IAsyncOperation's IntoFuture (`.await`) is off. Depend
# on it directly with std to enable it (feature unification, same 0.2.1 type).
windows-future = { version = "0.2.1", features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
