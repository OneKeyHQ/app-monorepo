<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
  <title>OneKey Recovery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0F0F0F;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-app-region: drag;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 360px;
      width: 100%;
      -webkit-app-region: no-drag;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 32px;
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }
    .subtitle {
      font-size: 14px;
      color: #8C8C8C;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 12px;
      color: #FFFFFF;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.7; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background-color: #2C2C2C; }
    .btn-primary { background-color: #44D62C; color: #000000; }
    .version {
      font-size: 12px;
      color: #666666;
      margin-top: 20px;
    }
    .error-msg {
      font-size: 12px;
      color: #FF6B6B;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- OneKey Logo SVG -->
    <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" rx="16" fill="#44D62C"/>
      <path d="M32 16C23.163 16 16 23.163 16 32C16 40.837 23.163 48 32 48C40.837 48 48 40.837 48 32C48 23.163 40.837 16 32 16ZM32 44C25.373 44 20 38.627 20 32C20 25.373 25.373 20 32 20C38.627 20 44 25.373 44 32C44 38.627 38.627 44 32 44Z" fill="#000000"/>
      <circle cx="32" cy="32" r="6" fill="#000000"/>
    </svg>

    <h1 class="title" id="title">Something went wrong</h1>
    <p class="subtitle" id="subtitle">The app failed to start. You can export logs for troubleshooting, try again, or auto repair to fix the issue.</p>

    <button class="btn btn-secondary" id="exportLogsBtn" onclick="handleExportLogs()">Export Logs</button>
    <button class="btn btn-secondary" id="tryAgainBtn" onclick="handleTryAgain()">Try Again</button>
    <button class="btn btn-primary" id="autoRepairBtn" onclick="handleAutoRepair()">Auto Repair</button>

    <div class="error-msg" id="errorMsg"></div>
    <div class="version" id="version"></div>
  </div>

  <script>
    // i18n
    const isZh = (navigator.language || '').startsWith('zh');
    const i18n = {
      title: isZh ? '应用启动失败' : 'Something went wrong',
      subtitle: isZh
        ? '应用启动失败。您可以导出日志用于排查问题，重试启动，或尝试自动修复。'
        : 'The app failed to start. You can export logs for troubleshooting, try again, or auto repair to fix the issue.',
      exportLogs: isZh ? '导出日志' : 'Export Logs',
      tryAgain: isZh ? '重试' : 'Try Again',
      autoRepair: isZh ? '自动修复' : 'Auto Repair',
      version: isZh ? '版本' : 'Version',
      exportError: isZh ? '导出日志失败' : 'Failed to export logs',
      repairError: isZh ? '部分清理步骤失败，应用将尝试重启' : 'Some cleanup steps failed. The app will try to restart.',
    };

    document.getElementById('title').textContent = i18n.title;
    document.getElementById('subtitle').textContent = i18n.subtitle;
    document.getElementById('exportLogsBtn').textContent = i18n.exportLogs;
    document.getElementById('tryAgainBtn').textContent = i18n.tryAgain;
    document.getElementById('autoRepairBtn').textContent = i18n.autoRepair;

    // Version display
    try {
      const ver = window.desktopApi?.getVersion?.() || '';
      if (ver) {
        document.getElementById('version').textContent = i18n.version + ' ' + ver;
      }
    } catch (_) {}

    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
    }

    function setButtonsDisabled(disabled) {
      document.getElementById('exportLogsBtn').disabled = disabled;
      document.getElementById('tryAgainBtn').disabled = disabled;
      document.getElementById('autoRepairBtn').disabled = disabled;
    }

    async function handleExportLogs() {
      showError('');
      setButtonsDisabled(true);
      try {
        const result = await window.desktopApi?.recoveryExportLogs?.();
        if (result && result.error) {
          showError(i18n.exportError + ': ' + result.error);
        }
      } catch (e) {
        showError(i18n.exportError + ': ' + (e.message || e));
      } finally {
        setButtonsDisabled(false);
      }
    }

    async function handleTryAgain() {
      showError('');
      setButtonsDisabled(true);
      try {
        await window.desktopApi?.recoveryTryAgain?.();
      } catch (e) {
        showError(e.message || e);
        setButtonsDisabled(false);
      }
    }

    async function handleAutoRepair() {
      showError('');
      setButtonsDisabled(true);
      try {
        const result = await window.desktopApi?.recoveryAutoRepair?.();
        if (result && result.error) {
          showError(i18n.repairError);
        }
      } catch (e) {
        showError(i18n.repairError);
        setButtonsDisabled(false);
      }
    }
  </script>
</body>
</html>
