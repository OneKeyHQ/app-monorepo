pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}
 
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}

expoAutolinking.useExpoModules()

rootProject.name = 'OneKey Wallet'

expoAutolinking.useExpoVersionCatalog()

include ':app'

includeBuild(expoAutolinking.reactNativeGradlePlugin)
includeBuild("build-logic")

// Use prebuilt React Native and Hermes AARs to avoid source builds.
// RN native source patches will be included in OneKey's own AARs once published.

// Stub module for @onekeyfe/react-native-app-update flavor isolation
include ':app-update-noop'

// All MMKV consumers use one source-built Core, including Nitro's prefab.
include ':mmkv'
project(':mmkv').projectDir = new File(rootDir, 'mmkv')

// Neutralize remote rich-media HTML rendering and the reflective JavaScript
// bridge in the pinned JPush Android SDK before Gradle compiles its jar. The
// patcher is hash-pinned and idempotent; an SDK upgrade fails the build until
// the new bytes are reviewed. JCore has no WebView call sites, and its
// JDynamicLoadBase implementation class is not packaged.
def jpushAndroidPatch = new File(rootDir, '../scripts/patch-jpush-android.py')
def jpushAndroidNodeModules = new File(rootDir, '../../../node_modules')
if (!jpushAndroidPatch.isFile()) {
  throw new GradleException("[JPush] Patch script is missing: ${jpushAndroidPatch.absolutePath}")
}
providers.exec {
  commandLine('python3', '-B', jpushAndroidPatch.absolutePath, jpushAndroidNodeModules.absolutePath)
}.result.get()
