<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>形式 3 · 时间线步骤条</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 16px 80px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f7f9; color: #1f2937; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .back { font-size: 13px; color: #6366f1; text-decoration: none; }
  h1 { font-size: 19px; margin: 10px 0 2px; }
  .sub { color: #6b7280; font-size: 13px; margin: 0 0 22px; }

  /* 时间线 */
  .tl { position: relative; margin-left: 8px; }
  .step { position: relative; padding-left: 40px; padding-bottom: 26px; }
  .step:not(:last-child)::before { content: ''; position: absolute; left: 13px; top: 6px; bottom: -4px; width: 2px; background: #d1d5db; }
  .dot { position: absolute; left: 4px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--c, #94a3b8); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--c); z-index: 1; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .card .tag { font-size: 11px; font-weight: 700; color: var(--c); }
  .card .title { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .card .subtitle { font-size: 13px; color: #6b7280; margin-top: 4px; line-height: 1.5; }
  .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #475569; }
  .chip b { color: #334155; font-weight: 700; }

  /* 分叉：两条子时间线并排 */
  .fork-note { margin: 4px 0 18px 40px; font-size: 12px; color: #9ca3af; }
  .branches { display: flex; gap: 20px; margin-left: 14px; }
  .bcol { flex: 1; min-width: 0; border-top: 2px solid var(--bc); border-radius: 2px; padding-top: 14px; }
  .blabel { font-size: 12px; font-weight: 700; margin: -26px 0 12px; display: inline-block; background: #f6f7f9; padding: 0 8px; color: var(--bc); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 返回形式对比</a>
    <h1>形式 3 · 时间线步骤条</h1>
    <p class="sub" id="sub"></p>
    <div id="root"></div>
  </div>

<script src="data.js"></script>
<script>
  const { colors, tags } = window.FLOW_META;
  const F = window.FLOW;
  document.getElementById("sub").textContent = "场景：" + F.title;

  function chips(d) {
    if (!d) return "";
    let out = [];
    if (d.params)  out.push('<span class="chip"><b>参数</b> ' + d.params.join("，") + "</span>");
    if (d.returns) out.push('<span class="chip"><b>返回</b> ' + d.returns.join("，") + "</span>");
    if (d.notes)   out.push('<span class="chip"><b>注意</b> ' + d.notes.join("；") + "</span>");
    return out.length ? '<div class="meta">' + out.join("") + "</div>" : "";
  }
  function step(n, idx) {
    return '<div class="step" style="--c:' + colors[n.type] + '">' +
      '<div class="dot">' + idx + "</div>" +
      '<div class="card"><div class="tag">' + tags[n.type] + "</div>" +
      '<div class="title">' + n.title + "</div>" +
      '<div class="subtitle">' + n.subtitle + "</div>" + chips(n.detail) + "</div></div>";
  }

  let i = 0;
  let html = '<div class="tl">';
  F.main.forEach(n => html += step(n, ++i));
  html += step(F.fork.node, ++i);
  html += "</div>";
  html += '<div class="fork-note">↓ 「' + F.fork.node.decision + '」分两条子时间线：</div>';
  html += '<div class="branches">';
  F.fork.branches.forEach(b => {
    const bc = b.tone === "ok" ? colors.success : colors.error;
    let sub = '<div class="bcol" style="--bc:' + bc + '"><span class="blabel" style="--bc:' + bc + '">' + b.label + "</span>";
    let j = 0;
    sub += '<div class="tl">' + b.nodes.map(n => step(n, "" + String.fromCharCode(96 + (++j)))).join("") + "</div>";
    sub += "</div>";
    html += sub;
  });
  html += "</div>";
  document.getElementById("root").innerHTML = html;
</script>
</body>
</html>
