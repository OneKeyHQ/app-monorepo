<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>形式 4 · SVG 蓝图</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 16px 80px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f7f9; color: #1f2937; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .back { font-size: 13px; color: #6366f1; text-decoration: none; }
  h1 { font-size: 19px; margin: 10px 0 2px; }
  .sub { color: #6b7280; font-size: 13px; margin: 0 0 14px; }
  .hint { font-size: 12px; color: #9ca3af; margin: 0 0 18px; }
  .canvas { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; }

  .nodebox { width: 100%; height: 100%; border: 1px solid #e5e7eb; border-left: 4px solid var(--c); border-radius: 9px; background: #fff; padding: 9px 11px; cursor: pointer; overflow: hidden; transition: box-shadow .15s; }
  .nodebox:hover { box-shadow: 0 6px 16px rgba(0,0,0,.12); }
  .nodebox .tag { font-size: 10px; font-weight: 700; color: var(--c); }
  .nodebox .t { font-size: 13px; font-weight: 600; margin-top: 1px; line-height: 1.25; }
  .nodebox .s { font-size: 11px; color: #6b7280; margin-top: 3px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dlabel { font-size: 12px; font-weight: 700; }
  .elabel { font-size: 12px; font-weight: 700; fill: #475569; }

  .panel { margin-top: 18px; background: #fff; border: 1px solid #e5e7eb; border-left: 4px solid var(--c, #94a3b8); border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); display: none; }
  .panel.show { display: block; }
  .panel .tag { font-size: 11px; font-weight: 700; color: var(--c); }
  .panel .title { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .panel .subtitle { font-size: 13px; color: #6b7280; margin-top: 5px; line-height: 1.5; }
  .panel h4 { margin: 10px 0 4px; font-size: 11px; color: #6b7280; }
  .panel ul { margin: 0; padding-left: 18px; }
  .panel li { font-size: 13px; line-height: 1.6; color: #374151; }
  .panel code { background: #f3f4f6; padding: 1px 6px; border-radius: 5px; font-size: 12px; color: #be123c; }
  .panel .empty { color: #9ca3af; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 返回形式对比</a>
    <h1>形式 4 · SVG 蓝图（手绘连线 + 菱形判断）</h1>
    <p class="sub" id="sub"></p>
    <p class="hint">👉 节点框 + 折线连接 + 菱形判断，是/否标在连线上。点任意节点框，下方看详情。</p>
    <div class="canvas" id="canvas"></div>
    <div class="panel" id="panel"></div>
  </div>

<script src="data.js"></script>
<script>
  const { colors, tags } = window.FLOW_META;
  const F = window.FLOW;
  document.getElementById("sub").textContent = "场景：" + F.title;

  const XMLNS = "http://www.w3.org/1999/xhtml";
  const W = 760, boxW = 220, boxH = 106, gap = 44, diaHW = 78, diaHH = 44;
  const cx = W / 2;

  const main = F.main, dec = F.fork.node, branches = F.fork.branches;
  const nodeMap = {};
  [...main, dec, ...branches.flatMap(b => b.nodes)].forEach(n => (nodeMap[n.id] = n));

  // y 计算
  const yTop = 16;
  const mainY = main.map((_, i) => yTop + i * (boxH + gap));
  const decTop = yTop + main.length * (boxH + gap);
  const decCy = decTop + diaHH;
  const branchTop = decTop + 2 * diaHH + gap;
  const maxLen = Math.max(...branches.map(b => b.nodes.length));
  const H = branchTop + maxLen * (boxH + gap) + 8;

  // 分支列中心
  const n = branches.length;
  const colCx = branches.map((_, k) => Math.round(W * (k + 1) / (n + 1)));

  let parts = [];
  const box = (node, x, y) =>
    '<foreignObject x="' + x + '" y="' + y + '" width="' + boxW + '" height="' + boxH + '">' +
    '<div xmlns="' + XMLNS + '" class="nodebox" data-id="' + node.id + '" style="--c:' + colors[node.type] + '">' +
    '<div class="tag">' + tags[node.type] + '</div><div class="t">' + node.title + '</div><div class="s">' + node.subtitle + '</div></div></foreignObject>';

  const vline = (x, y1, y2) => '<path d="M' + x + ' ' + y1 + ' V' + y2 + '" class="edge"/>';

  // 主链路
  main.forEach((node, i) => {
    parts.push(box(node, cx - boxW / 2, mainY[i]));
    if (i > 0) parts.push(vline(cx, mainY[i - 1] + boxH, mainY[i]));
  });
  // 最后一个 main → 决策
  parts.push(vline(cx, mainY[mainY.length - 1] + boxH, decTop));

  // 菱形决策
  const dTop = decTop, dBot = decTop + 2 * diaHH;
  parts.push('<polygon points="' + cx + ',' + dTop + ' ' + (cx + diaHW) + ',' + decCy + ' ' + cx + ',' + dBot + ' ' + (cx - diaHW) + ',' + decCy + '" fill="#eff6ff" stroke="' + colors[dec.type] + '" stroke-width="2"/>');
  parts.push('<foreignObject x="' + (cx - 66) + '" y="' + (decCy - 26) + '" width="132" height="52">' +
    '<div xmlns="' + XMLNS + '" class="nodebox" data-id="' + dec.id + '" style="--c:' + colors[dec.type] + ';border:none;border-left:none;background:transparent;text-align:center;padding:0;">' +
    '<div class="t" style="font-size:12px">Verify OTP</div><div class="t" style="font-size:13px;color:' + colors[dec.type] + '">' + dec.decision + '</div></div></foreignObject>');

  // 决策 → 各分支
  branches.forEach((b, k) => {
    const tx = colCx[k];
    const isLeft = tx < cx, isRight = tx > cx;
    const startX = isLeft ? cx - diaHW : isRight ? cx + diaHW : cx;
    const startY = (isLeft || isRight) ? decCy : dBot;
    parts.push('<path d="M' + startX + ' ' + startY + ' H' + tx + ' V' + branchTop + '" class="edge"/>');
    // 是/否 标签
    const lab = b.label.split(" ")[0];
    const lx = isLeft ? (startX + tx) / 2 : isRight ? (startX + tx) / 2 : tx + 10;
    parts.push('<text x="' + lx + '" y="' + (decCy - 8) + '" text-anchor="middle" class="dlabel" fill="' + (b.tone === "ok" ? colors.success : colors.error) + '">' + lab + '</text>');
    // 分支节点竖直堆叠
    b.nodes.forEach((node, j) => {
      const y = branchTop + j * (boxH + gap);
      parts.push(box(node, tx - boxW / 2, y));
      if (j > 0) parts.push(vline(tx, branchTop + (j - 1) * (boxH + gap) + boxH, y));
    });
  });

  const svg =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>' +
    '<style>.edge{fill:none;stroke:#cbd5e1;stroke-width:2;marker-end:url(#arrow);}</style></defs>' +
    parts.join("") + "</svg>";

  const canvas = document.getElementById("canvas");
  canvas.innerHTML = svg;

  // 点击节点 → 详情面板
  function showDetail(id) {
    const node = nodeMap[id];
    if (!node) return;
    const d = node.detail || {};
    const sec = (t, arr) => arr ? "<h4>" + t + "</h4><ul>" + arr.map(x => "<li><code>" + x + "</code></li>").join("") + "</ul>" : "";
    let body = sec("参数", d.params) + sec("返回", d.returns);
    if (d.notes) body += "<h4>注意</h4><ul>" + d.notes.map(x => "<li>" + x + "</li>").join("") + "</ul>";
    if (!body) body = '<p class="empty">（此节点无附加参数/返回）</p>';
    const p = document.getElementById("panel");
    p.style.setProperty("--c", colors[node.type]);
    p.innerHTML = '<div class="tag">' + tags[node.type] + '</div><div class="title">' + node.title + '</div><div class="subtitle">' + node.subtitle + "</div>" + body;
    p.classList.add("show");
  }
  canvas.addEventListener("click", (e) => {
    const el = e.target.closest("[data-id]");
    if (el) showDetail(el.getAttribute("data-id"));
  });
</script>
</body>
</html>
