<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>形式 2 · 经典流程图（Mermaid）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 16px 80px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f7f9; color: #1f2937; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .back { font-size: 13px; color: #6366f1; text-decoration: none; }
  h1 { font-size: 19px; margin: 10px 0 2px; }
  .sub { color: #6b7280; font-size: 13px; margin: 0 0 14px; }
  .hint { font-size: 12px; color: #9ca3af; margin: 0 0 18px; }
  .diagram { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.05); overflow-x: auto; text-align: center; }
  .diagram svg { max-width: 100%; height: auto; }
  .panel { margin-top: 18px; background: #fff; border: 1px solid #e5e7eb; border-left: 4px solid var(--c, #94a3b8); border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); display: none; }
  .panel.show { display: block; }
  .panel .tag { font-size: 11px; font-weight: 700; color: var(--c); }
  .panel .title { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .panel .subtitle { font-size: 13px; color: #6b7280; margin-top: 5px; line-height: 1.5; }
  .panel h4 { margin: 10px 0 4px; font-size: 11px; color: #6b7280; }
  .panel ul { margin: 0; padding-left: 18px; }
  .panel li { font-size: 13px; line-height: 1.6; color: #374151; }
  .panel code { background: #f3f4f6; padding: 1px 6px; border-radius: 5px; font-size: 12px; color: #be123c; }
  .panel .empty { color: #9ca3af; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 返回形式对比</a>
    <h1>形式 2 · 经典流程图（Mermaid 自动布局）</h1>
    <p class="sub" id="sub"></p>
    <p class="hint">👉 矩形=接口/操作，菱形=判断，圆角=终态，箭头带「是/否」标签。点任意节点，下方看详情。</p>
    <div class="diagram"><div id="graph"></div></div>
    <div class="panel" id="panel"></div>
  </div>

<script src="data.js"></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

  const { colors, tags } = window.FLOW_META;
  const F = window.FLOW;
  document.getElementById("sub").textContent = "场景：" + F.title;

  const sid = (id) => id.replace(/-/g, "_");
  const nodeMap = {};
  [...F.main, F.fork.node, ...F.fork.branches.flatMap(b => b.nodes)].forEach(n => (nodeMap[sid(n.id)] = n));

  // 生成 Mermaid 定义
  function box(n) {
    const label = tags[n.type] + "<br/>" + n.title;
    if (n.id === F.fork.node.id) return sid(n.id) + '{"' + tags[n.type] + "<br/>" + n.title + "<br/>" + n.decision + '"}';
    if (n.type === "success" || n.type === "error") return sid(n.id) + '(["' + label + '"])';
    return sid(n.id) + '["' + label + '"]';
  }
  let lines = ["flowchart TD"];
  // 主链路
  for (let i = 0; i < F.main.length; i++) {
    lines.push("  " + box(F.main[i]));
    if (i > 0) lines.push("  " + sid(F.main[i - 1].id) + " --> " + sid(F.main[i].id));
  }
  lines.push("  " + box(F.fork.node));
  lines.push("  " + sid(F.main[F.main.length - 1].id) + " --> " + sid(F.fork.node.id));
  // 分支
  F.fork.branches.forEach(b => {
    const lbl = b.label.split(" ")[0]; // 是 / 否
    b.nodes.forEach((n, i) => {
      lines.push("  " + box(n));
      if (i === 0) lines.push("  " + sid(F.fork.node.id) + " -->|" + lbl + "| " + sid(n.id));
      else lines.push("  " + sid(b.nodes[i - 1].id) + " --> " + sid(n.id));
    });
  });
  // 颜色 class
  lines.push("  classDef api fill:#eff6ff,stroke:#2563eb,color:#1e3a8a;");
  lines.push("  classDef user fill:#f5f3ff,stroke:#7c3aed,color:#4c1d95;");
  lines.push("  classDef success fill:#f0fdf4,stroke:#16a34a,color:#14532d;");
  lines.push("  classDef error fill:#fef2f2,stroke:#dc2626,color:#7f1d1d;");
  Object.values(nodeMap).forEach(n => lines.push("  class " + sid(n.id) + " " + n.type + ";"));
  // 点击回调
  Object.values(nodeMap).forEach(n => lines.push("  click " + sid(n.id) + ' call onNode("' + sid(n.id) + '")'));

  const def = lines.join("\n");

  window.onNode = function (id) {
    const n = nodeMap[id];
    if (!n) return;
    const d = n.detail || {};
    const sec = (t, arr) => arr ? "<h4>" + t + "</h4><ul>" + arr.map(x => "<li><code>" + x + "</code></li>").join("") + "</ul>" : "";
    let body = sec("参数", d.params) + sec("返回", d.returns);
    if (d.notes) body += "<h4>注意</h4><ul>" + d.notes.map(x => "<li>" + x + "</li>").join("") + "</ul>";
    if (!body) body = '<p class="empty">（此节点无附加参数/返回）</p>';
    const p = document.getElementById("panel");
    p.style.setProperty("--c", colors[n.type]);
    p.innerHTML = '<div class="tag">' + tags[n.type] + "</div><div class=\"title\">" + n.title + "</div><div class=\"subtitle\">" + n.subtitle + "</div>" + body;
    p.classList.add("show");
  };

  mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base", flowchart: { curve: "basis", nodeSpacing: 40, rankSpacing: 46 }, themeVariables: { fontFamily: "-apple-system, PingFang SC, sans-serif", fontSize: "14px" } });
  const { svg, bindFunctions } = await mermaid.render("flowGraph", def);
  const host = document.getElementById("graph");
  host.innerHTML = svg;
  if (bindFunctions) bindFunctions(host);
</script>
</body>
</html>
