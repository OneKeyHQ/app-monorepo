# cspell:words prebundle
name: Metro Dev Prebundle

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: metro-dev-prebundle-x
  cancel-in-progress: false

env:
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  build:
    name: Build public prebundle
    if: github.repository == 'OneKeyHQ/app-monorepo' && github.ref == 'refs/heads/x'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: yarn
          registry-url: https://npm.pkg.github.com
          check-latest: true
          scope: '@onekeyhq'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=8192
        run: yarn install --immutable

      - name: Resolve immutable release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(node apps/mobile/scripts/metro-dev-prebundle.js tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Prebundle release already exists: $tag"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iOS and Android prebundles
        if: steps.release.outputs.exists != 'true'
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: yarn workspace @onekeyhq/mobile dev-vendor:build --platform all

      - name: Package release assets and notices
        if: steps.release.outputs.exists != 'true'
        run: >-
          yarn workspace @onekeyhq/mobile metro-dev-prebundle:package
          --source-commit "$GITHUB_SHA"

      - name: Upload prebundle release assets
        if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: metro-dev-prebundle-release
          path: apps/mobile/out-dir-bundle/metro-dev-prebundle-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Write build summary
        env:
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "### Metro dev prebundle"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Already existed: \`$RELEASE_EXISTS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish public prebundle
    needs: build
    if: needs.build.outputs.exists != 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download prebundle release assets
        uses: actions/download-artifact@v4
        with:
          name: metro-dev-prebundle-release
          path: apps/mobile/out-dir-bundle/metro-dev-prebundle-release

      - name: Verify downloaded release asset set
        run: |
          set -euo pipefail
          release_dir="apps/mobile/out-dir-bundle/metro-dev-prebundle-release"
          for asset in \
            THIRD_PARTY_NOTICES.txt \
            metro-dev-prebundle-packages.json \
            metro-dev-prebundle-release.json \
            metro-dev-prebundle-ios-common.js.gz \
            metro-dev-prebundle-ios-common.hbc.gz \
            metro-dev-prebundle-ios-manifest.json \
            metro-dev-prebundle-android-common.js.gz \
            metro-dev-prebundle-android-common.hbc.gz \
            metro-dev-prebundle-android-manifest.json; do
            test -s "$release_dir/$asset"
          done

      - name: Generate build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: apps/mobile/out-dir-bundle/metro-dev-prebundle-release/*

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            apps/mobile/out-dir-bundle/metro-dev-prebundle-release/* \
            --target "$GITHUB_SHA" \
            --title "Metro dev prebundle ${RELEASE_TAG##*-}" \
            --notes "Public development prebundle for compatible iOS and Android Metro builds. Assets include generated third-party notices and GitHub build provenance attestations." \
            --prerelease \
            --latest=false

      - name: Write publish summary
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "### Metro dev prebundle"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Published: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"
