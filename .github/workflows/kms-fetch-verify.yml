name: KMS Fetch Verify

on:
  workflow_dispatch:
    inputs:
      secret-names:
        description: 'KMS secret name(s) to fetch, one per line'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Fetch and decrypt KMS secret
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch KMS secret
        id: kms
        # Temporary verification pin for OneKeyHQ/actions#108.
        uses: qwang1113/actions/fetch-kms-secrets@d27dd5ca82d523739cbedd1119ae061b526e1a41
        with:
          volc-account-id: ${{ vars.VOLC_ACCOUNT_ID }}
          volc-role-trn: ${{ vars.VOLC_ROLE_TRN }}
          volc-kms-region: ${{ vars.VOLC_KMS_REGION }}
          secret-names: ${{ inputs['secret-names'] }}
          decrypt-private-key: ${{ secrets.KMS_DECRYPT_PRIVATE_KEY }}

      - name: Verify decrypted test payload
        env:
          FETCHED_KEYS: ${{ steps.kms.outputs.fetched-keys }}
        run: |
          set -euo pipefail
          EXPECTED_KEYS='["APP_RUN_ENV","SERVICE_AUTH_TOKEN","CLIENT_LICENSE_KEY","ENCRYPTION_SALT","WEBHOOK_SECURE_URL"]'

          jq -e --argjson expected "$EXPECTED_KEYS" \
            'type == "array" and sort == ($expected | sort)' \
            <<<"$FETCHED_KEYS" >/dev/null

          while IFS= read -r key; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::KMS value for $key is empty"
              exit 1
            fi
          done < <(jq -r '.[]' <<<"$EXPECTED_KEYS")

          if [[ "$APP_RUN_ENV" != "production" ]]; then
            echo "::error::APP_RUN_ENV does not match the expected test value"
            exit 1
          fi

          if [[ "$WEBHOOK_SECURE_URL" != https://* ]]; then
            echo "::error::WEBHOOK_SECURE_URL must use HTTPS"
            exit 1
          fi

          echo "KMS fetch, decrypt, and payload verification completed."
