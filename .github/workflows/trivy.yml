name: Trivy Security Scan

on:
  push:
    branches:
      - x
      - hotfix/*
      - release/*
  pull_request:
    branches:
      - x
      - hotfix/*
      - release/*
  schedule:
    - cron: "36 17 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy-security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          timeout: 20m0s

      - name: Upload SARIF results
        # Skip on pull_request: the code-scanning results check that this
        # upload creates should list only alerts inside the PR diff, but once
        # a diff exceeds GitHub's processing limit it silently falls back to
        # attributing every open alert on the merge ref to the PR (the check
        # summary says "code changes were too large"). Big PRs then fail on
        # baseline yarn.lock CVEs they never touched. Push and schedule scans
        # keep the Security tab current; Socket and Snyk cover PR-level
        # dependency review.
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
