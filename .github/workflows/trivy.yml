name: Trivy Security Scan

on:
  push:
    branches:
      - x
      - hotfix/*
      - release/*
  pull_request:
    branches:
      - x
      - hotfix/*
      - release/*
  schedule:
    - cron: "36 17 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy-security-scan:
    name: Trivy Security Scan
    # Publish SARIF for every event, including PRs. Once installed on the PR
    # target, the trusted incremental gate is the blocking PR check.
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          timeout: 20m0s

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  trivy-policy-installation:
    name: Trivy policy installation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Initialize safe failure evidence
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-evidence"
          echo '{"schemaVersion":1,"status":"incomplete","error":"setup_failed"}' > "$RUNNER_TEMP/trivy-evidence/result.json"

      - name: Check installed PR-target policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted

      # Never execute the PR's comparator. Until the PR target has the workflow,
      # the full scan and its SARIF checks remain the required security checks.
      - name: Select trusted gate or installation scan
        id: policy
        run: |
          if [ -f trusted/.github/workflows/trivy-pr-gate.yml ]; then
            test -f trusted/.github/scripts/trivy_gate.py
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo '{"schemaVersion":1,"status":"delegated","requiredCheck":"Trivy PR incremental gate"}' > "$RUNNER_TEMP/trivy-evidence/result.json"
            echo 'The incremental gate runs from the base-owned pull_request_target workflow.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '{"schemaVersion":1,"status":"installation","requiredCheck":"Trivy Security Scan"}' > "$RUNNER_TEMP/trivy-evidence/result.json"
            echo 'The PR target revision does not yet contain the trusted Trivy workflow. The existing full Trivy scan and SARIF checks are required for this installation PR.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain sanitized installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-installation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-evidence/
          retention-days: 14
          if-no-files-found: error

  trivy-gate-tests:
    name: Trivy gate unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Candidate tests are untrusted and run in their own job, with no secrets
      # or write permissions. They cannot supply data to the trusted gate.
      - run: python3 -I .github/scripts/trivy_gate_test.py
      - name: Set up pinned Trivy for scanner regressions
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.71.0
          cache: false
      - name: Run real-scanner coverage regressions
        run: python3 -I .github/scripts/trivy_gate_integration_test.py
