name: release-ext

on:
  workflow_run:
    workflows:
      - daily-build
      - daily-build-dev
    types:
      - completed
  workflow_dispatch:

env:
  # Release artifacts must ship the licensed brand font; fonts-sync fails
  # instead of falling back to the open-source face.
  ONEKEY_REQUIRE_PRIVATE_FONTS: '1'
  NODE_ENV: production
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  # Fetches the licensed brand font without running repository code; build
  # jobs below restore it from an encrypted artifact.
  private-fonts:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/private-fonts.yml
    secrets:
      PRIVATE_FONTS_TOKEN: ${{ secrets.PRIVATE_FONTS_TOKEN }}
      PRIVATE_FONTS_ARTIFACT_KEY: ${{ secrets.PRIVATE_FONTS_ARTIFACT_KEY }}

  release-ext:
    needs: private-fonts
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24.x]

    if: ${{ !github.event.workflow_run || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Show executed time
        run: |
          echo "Executed at: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # Restore the private brand font fetched by the trusted `private-fonts` job
      # (no App key here; the artifact key only decrypts fonts). fonts:sync
# verifies the result against this checkout's brand.lock.json.
      - name: Restore private fonts
        if: needs.private-fonts.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.private-fonts.outputs.artifact }}
          path: ${{ runner.temp }}/private-fonts-artifact

      - name: Decrypt private fonts
        if: needs.private-fonts.outputs.artifact != ''
        shell: bash
        env:
          FONTS_KEY: ${{ secrets.PRIVATE_FONTS_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/onekey-private-fonts"
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const [input, dir] = process.argv.slice(1);
            const blob = fs.readFileSync(input);
            const decipher = crypto.createDecipheriv('aes-256-gcm', Buffer.from(process.env.FONTS_KEY, 'hex'), blob.subarray(0, 12));
            decipher.setAuthTag(blob.subarray(12, 28));
            const bundle = JSON.parse(Buffer.concat([decipher.update(blob.subarray(28)), decipher.final()]).toString());
            fs.rmSync(dir, { recursive: true, force: true });
            fs.mkdirSync(dir, { recursive: true });
            for (const [name, data] of Object.entries(bundle)) {
              if (!/^[a-z]+\.ttf$/.test(name)) throw new Error('unexpected font entry ' + name);
              fs.writeFileSync(path.join(dir, name), Buffer.from(data, 'base64'));
            }
          " "${RUNNER_TEMP}/private-fonts-artifact/private-fonts.enc" "$dir"
          rm -rf "${RUNNER_TEMP}/private-fonts-artifact"
          echo "ONEKEY_PRIVATE_FONTS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          env_file_name: '.env'
          sentry_project: 'chrome-extension'
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}
          sentry_dsn_react_native: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
          sentry_dsn_web: ${{ secrets.SENTRY_DSN_WEB }}
          sentry_dsn_desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry_dsn_mas: ${{ secrets.SENTRY_DSN_MAS }}
          sentry_dsn_snap: ${{ secrets.SENTRY_DSN_SNAP }}
          sentry_dsn_winms: ${{ secrets.SENTRY_DSN_WINMS }}
          sentry_dsn_ext: ${{ secrets.SENTRY_DSN_EXT }}

      - name: 'Setup ENV'
        run: |
          eval "$(node -e 'const v=require("./apps/ext/package.json").version; console.log("pkg_version="+v)')"
          echo '$pkg_version='$pkg_version
          echo "PKG_VERSION=$pkg_version" >> $GITHUB_ENV

          artifacts_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "ARTIFACTS_URL=$artifacts_url" >> $GITHUB_ENV


      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: |
          node <<'NODE'
          // Match the repository's Yarn 4 cache path without executing checkout plugins.
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const base = process.platform === 'win32'
            ? path.join(process.env.LOCALAPPDATA || path.join(os.homedir(), 'AppData', 'Local'), 'Yarn', 'Berry')
            : process.env.XDG_DATA_HOME
              ? path.join(process.env.XDG_DATA_HOME, 'yarn', 'berry')
              : path.join(os.homedir(), '.yarn', 'berry');
          const cache = process.env.YARN_ENABLE_GLOBAL_CACHE === 'true'
            ? path.join(base, 'cache') : path.join(process.env.GITHUB_WORKSPACE, '.yarn', 'cache');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${cache}\narch=${process.arch}\n`);
          NODE

      - name: Restore Yarn cache from x
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dep
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        uses: ./.github/actions/install-dependencies

      - name: Build Ext
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: 'yarn app:ext:build:all'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onekey-extension-rn-${{ env.BUILD_APP_VERSION }}-${{ env.BUILD_NUMBER }}-${{ env.BUILD_BUNDLE_VERSION }}-${{ github.sha }}
          path: |
            ./apps/ext/build/_dist/*.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onekey-extension-rn-development-build-${{ env.BUILD_APP_VERSION }}-${{ env.BUILD_NUMBER }}-${{ env.BUILD_BUNDLE_VERSION }}-${{ github.sha }}
          path: |
            ./apps/ext/build/_development_build_dist/*.zip

      - name: 'Notify to Slack'
        if: ${{ github.event.workflow_run }}
        uses: onekeyhq/actions/slack-notify-webhook@86ad045e18da7958f659995ee2f9df375dd03ef4 # pin to SHA
        with:
          web-hook-url: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
          secret-key: ${{ secrets.ACTION_SIGN_SECERT_KEY }}
          artifact-type: Extension
          artifact-name: OneKey-Extension-RN
          artifact-bundle-id: 'so.onekey.wallet.extension'
          artifact-version-name: '${{ env.BUILD_APP_VERSION }}@${{ env.BUILD_NUMBER }}'
          artifact-version-code: '${{ env.BUILD_NUMBER }}'
          artifact-download-url: '${{ env.ARTIFACTS_URL }}'
          artifact-skip-gpg: '${{ env.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION }}'
          artifact-bundle-version: '${{ env.BUILD_BUNDLE_VERSION }}'

      - name: Unmount dependency image
        if: always() && steps.dependencies.outcome != 'skipped'
        run: python3 .github/scripts/ci-dependencies.py cleanup
