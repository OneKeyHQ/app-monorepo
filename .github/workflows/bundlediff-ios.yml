name: bundlediff-ios

on:
  pull_request:
    branches: [onekey]

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  # Build current and upload stats.json
  # You may replace this with your own build method. All that
  # is required is that the stats.json be an artifact
  build-ios-head:
    name: 'Build ios head'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{github.event.pull_request.head.ref}}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Write iOS bundle diff AI prompt
        run: |
          mkdir -p ci-ai
          write_fallback_prompt() {
            cat > ci-ai/bundlediff-ios-ai-prompt.md <<'EOF'
          ## AI Triage Prompt

          Fix the OneKey iOS bundle diff failure by inspecting the Metro stats generation log and, when available, comparing head/base stats.

          ### Start Here
          - Inspect `stats-ios-head.log` first because this job failed before compare diagnostics could run.
          - If `head-stats` and `base-stats` artifacts exist, compare `head-stats/stats.json` and `base-stats/stats.json`.
          - Identify modules newly entering the main UI JS runtime, background JS runtime, common code, or shared vendor chunks.
          - Do not hide bundle growth by weakening compare thresholds or removing stats output.
          EOF
          }
          if [ -f .github/scripts/ciFailureIssue.js ]; then
            node .github/scripts/ciFailureIssue.js prompt bundlediff-ios > ci-ai/bundlediff-ios-ai-prompt.md || \
              write_fallback_prompt
          else
            write_fallback_prompt
          fi

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn install --immutable

      - name: Generate stats.json
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          mkdir -p ci-ai
          set +e
          yarn stats:ios 2>&1 | tee ci-ai/stats-ios-head.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload iOS head AI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ai-bundlediff-ios-head
          path: |
            ci-ai/bundlediff-ios-ai-prompt.md
            ci-ai/stats-ios-head.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain iOS head bundle diff failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-bundlediff-ios-head\`"
            echo "- Open: \`stats-ios-head.log\` and \`bundlediff-ios-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-bundlediff-ios-head and inspect stats-ios-head.log"

      - name: Upload stats.json
        uses: actions/upload-artifact@v4
        with:
          name: head-stats
          path: ./apps/app/stats.json

  # Build base for comparison and upload stats.json
  # You may replace this with your own build method. All that
  # is required is that the stats.json be an artifact
  build-ios-base:
    name: 'Build ios base'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Write iOS bundle diff AI prompt
        run: |
          mkdir -p ci-ai
          write_fallback_prompt() {
            cat > ci-ai/bundlediff-ios-ai-prompt.md <<'EOF'
          ## AI Triage Prompt

          Fix the OneKey iOS bundle diff failure by inspecting the Metro stats generation log and, when available, comparing head/base stats.

          ### Start Here
          - Inspect `stats-ios-base.log` first because this job failed before compare diagnostics could run.
          - If `head-stats` and `base-stats` artifacts exist, compare `head-stats/stats.json` and `base-stats/stats.json`.
          - Identify modules newly entering the main UI JS runtime, background JS runtime, common code, or shared vendor chunks.
          - Do not hide bundle growth by weakening compare thresholds or removing stats output.
          EOF
          }
          if [ -f .github/scripts/ciFailureIssue.js ]; then
            node .github/scripts/ciFailureIssue.js prompt bundlediff-ios > ci-ai/bundlediff-ios-ai-prompt.md || \
              write_fallback_prompt
          else
            write_fallback_prompt
          fi

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn install --immutable

      - name: Generate stats.json
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          mkdir -p ci-ai
          set +e
          yarn stats:ios 2>&1 | tee ci-ai/stats-ios-base.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload iOS base AI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ai-bundlediff-ios-base
          path: |
            ci-ai/bundlediff-ios-ai-prompt.md
            ci-ai/stats-ios-base.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain iOS base bundle diff failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-bundlediff-ios-base\`"
            echo "- Open: \`stats-ios-base.log\` and \`bundlediff-ios-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-bundlediff-ios-base and inspect stats-ios-base.log"

      - name: Upload stats.json
        uses: actions/upload-artifact@v4
        with:
          name: base-stats
          path: ./apps/app/stats.json

  # run the action against the stats.json files
  compare:
    name: 'Compare base & head bundle sizes'
    runs-on: ubuntu-24.04
    needs: [build-ios-base, build-ios-head]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Write iOS bundle diff compare AI prompt
        run: |
          mkdir -p ci-ai
          cat > ci-ai/bundlediff-ios-ai-prompt.md <<'EOF'
          ## AI Triage Prompt

          Fix the OneKey iOS bundle diff failure by comparing head/base Metro stats and reducing unintended native bundle growth.

          ### Start Here
          - Inspect the failed compare action log first.
          - Download artifacts: `head-stats`, `base-stats`, and `ci-ai-bundlediff-ios-*`.
          - Compare `head-stats/stats.json` and `base-stats/stats.json` for modules newly entering main UI JS runtime, background JS runtime, common code, or shared vendor chunks.
          - Do not hide bundle growth by weakening compare thresholds or removing stats output.
          EOF

      - uses: actions/download-artifact@v4.1.7

      - uses: github/webpack-bundlesize-compare-action@v1.7.0
        with:
          title: 'ios bundle diff'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          current-stats-json-path: ./head-stats/stats.json
          base-stats-json-path: ./base-stats/stats.json

      - name: Upload iOS compare AI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ai-bundlediff-ios-compare
          path: ci-ai/bundlediff-ios-ai-prompt.md
          if-no-files-found: warn
          retention-days: 14

      - name: Explain iOS compare failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-bundlediff-ios-compare\`"
            echo "- Also download: \`head-stats\` and \`base-stats\`"
            echo "- Open: \`bundlediff-ios-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-bundlediff-ios-compare plus head-stats/base-stats"
