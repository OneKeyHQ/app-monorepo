name: bundlediff-web

on:
  pull_request:
    branches: [onekey]

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  # Build current and upload stats.json
  # You may replace this with your own build method. All that
  # is required is that the stats.json be an artifact
  build-web-head:
    name: 'Build web head'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{github.event.pull_request.head.ref}}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Write web bundle diff AI prompt
        run: |
          mkdir -p ci-ai
          if [ -f .github/scripts/ciFailureIssue.js ]; then
            node .github/scripts/ciFailureIssue.js prompt bundlediff-web > ci-ai/bundlediff-web-ai-prompt.md || \
              echo "AI prompt generation failed; inspect the failed step log and stats-web-head.log." > ci-ai/bundlediff-web-ai-prompt.md
          else
            echo "AI prompt helper is not present on this checked-out ref; use the compare job diagnostics artifact." > ci-ai/bundlediff-web-ai-prompt.md
          fi

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn install --immutable

      - name: Generate stats.json
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          mkdir -p ci-ai
          set +e
          yarn stats:web 2>&1 | tee ci-ai/stats-web-head.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload web head AI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ai-bundlediff-web-head
          path: |
            ci-ai/bundlediff-web-ai-prompt.md
            ci-ai/stats-web-head.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain web head bundle diff failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-bundlediff-web-head\`"
            echo "- Open: \`stats-web-head.log\` and \`bundlediff-web-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-bundlediff-web-head and inspect stats-web-head.log"

      - name: Upload stats.json
        uses: actions/upload-artifact@v4
        with:
          name: head-stats
          path: ./apps/web/web-build/stats.json

  # Build base for comparison and upload stats.json
  # You may replace this with your own build method. All that
  # is required is that the stats.json be an artifact
  build-web-base:
    name: 'Build web base'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Write web bundle diff AI prompt
        run: |
          mkdir -p ci-ai
          if [ -f .github/scripts/ciFailureIssue.js ]; then
            node .github/scripts/ciFailureIssue.js prompt bundlediff-web > ci-ai/bundlediff-web-ai-prompt.md || \
              echo "AI prompt generation failed; inspect the failed step log and stats-web-base.log." > ci-ai/bundlediff-web-ai-prompt.md
          else
            echo "AI prompt helper is not present on this checked-out ref; use the compare job diagnostics artifact." > ci-ai/bundlediff-web-ai-prompt.md
          fi

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn install --immutable

      - name: Generate stats.json
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          mkdir -p ci-ai
          set +e
          yarn stats:web 2>&1 | tee ci-ai/stats-web-base.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload web base AI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ai-bundlediff-web-base
          path: |
            ci-ai/bundlediff-web-ai-prompt.md
            ci-ai/stats-web-base.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain web base bundle diff failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-bundlediff-web-base\`"
            echo "- Open: \`stats-web-base.log\` and \`bundlediff-web-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-bundlediff-web-base and inspect stats-web-base.log"

      - name: Upload stats.json
        uses: actions/upload-artifact@v4
        with:
          name: base-stats
          path: ./apps/web/web-build/stats.json

  # run the action against the stats.json files
  compare:
    name: 'Compare base & head bundle sizes'
    runs-on: ubuntu-24.04
    needs: [build-web-base, build-web-head]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Write web bundle diff compare AI prompt
        run: |
          mkdir -p ci-ai
          cat > ci-ai/bundlediff-web-ai-prompt.md <<'EOF'
          ## AI Triage Prompt

          Fix the OneKey web bundle diff failure by comparing head/base stats and reducing unintended startup or bundle growth.

          ### Start Here
          - Inspect the failed compare action log first.
          - Download artifacts: `head-stats`, `base-stats`, and `ci-ai-bundlediff-web-*`.
          - Compare `head-stats/stats.json` and `base-stats/stats.json` for added modules, duplicated packages, new initial chunks, and large vendor movement.
          - Do not hide bundle growth by weakening compare thresholds or removing stats output.
          EOF

      - uses: actions/download-artifact@v4.1.7

      - uses: github/webpack-bundlesize-compare-action@v1.7.0
        with:
          title: 'web bundle diff'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          current-stats-json-path: ./head-stats/stats.json
          base-stats-json-path: ./base-stats/stats.json

      - name: Upload web compare AI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ai-bundlediff-web-compare
          path: ci-ai/bundlediff-web-ai-prompt.md
          if-no-files-found: warn
          retention-days: 14

      - name: Explain web compare failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-bundlediff-web-compare\`"
            echo "- Also download: \`head-stats\` and \`base-stats\`"
            echo "- Open: \`bundlediff-web-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-bundlediff-web-compare plus head-stats/base-stats"
