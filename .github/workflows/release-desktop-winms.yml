name: release-desktop-winms

on:
  workflow_dispatch:
    inputs:
      ONEKEY_ALLOW_SKIP_GPG_VERIFICATION:
        description: "Allow skipping GPG verification for bundle updates (default: false)"
        required: false
        type: boolean
        default: false

env:
  # Release artifacts must ship the licensed brand font; fonts-sync fails
  # instead of falling back to the open-source face.
  ONEKEY_REQUIRE_PRIVATE_FONTS: '1'
  NODE_ENV: production
  YARN_ENABLE_GLOBAL_CACHE: true
  ONEKEY_ALLOW_SKIP_GPG_VERIFICATION: ${{ github.event.inputs.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION || 'false' }}

jobs:
  release-desktop-winms:
    runs-on: windows-2025
    strategy:
      matrix:
        node-version: [24.x]

    if: ${{ !github.event.workflow_run || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Show executed time
        run: |
          Write-Host "Executed at: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # Fetch the private brand font with pinned third-party code before any
      # repository code runs: the App private key never reaches a local action, the
      # token is revoked right after the download, and later steps only receive the
      # sha256-verified font directory.
      - name: Mint private fonts token
        id: private-fonts-token
        if: vars.PRIVATE_FONTS_APP_ID != ''
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.PRIVATE_FONTS_APP_ID }}
          private-key: ${{ secrets.PRIVATE_FONTS_APP_PRIVATE_KEY }}
          owner: OneKeyHQ
          repositories: app-private-fonts
          permission-contents: read
          skip-token-revoke: true

      - name: Download private fonts
        if: steps.private-fonts-token.outputs.token != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.private-fonts-token.outputs.token }}
          LOCK: packages/components/src/hocs/Provider/fonts/brand.lock.json
        run: |
          set -euo pipefail
          # Native jq.exe on Windows runners emits CRLF; strip \r from its output.
          revoke() {
            curl -fsS -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/installation/token >/dev/null || true
          }
          trap revoke EXIT
          dir="${RUNNER_TEMP}/onekey-private-fonts"
          rm -rf "$dir" && mkdir -p "$dir"
          commit="$(jq -r '.commit' "$LOCK" | tr -d '\r')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::brand.lock.json pins no commit"; exit 1; }
          for slot in regular medium semibold bold; do
            file="$(jq -r --arg s "$slot" '.files[$s].path' "$LOCK" | tr -d '\r')"
            sha="$(jq -r --arg s "$slot" '.files[$s].sha256' "$LOCK" | tr -d '\r')"
            [[ "$file" =~ ^[A-Za-z0-9._/-]+$ && "$file" != *..* ]] || { echo "::error::invalid font path for $slot"; exit 1; }
            curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" -o "$dir/$slot.ttf" \
              "https://api.github.com/repos/OneKeyHQ/app-private-fonts/contents/${file}?ref=${commit}"
            if command -v sha256sum >/dev/null; then actual="$(sha256sum "$dir/$slot.ttf" | cut -d' ' -f1)"; else actual="$(shasum -a 256 "$dir/$slot.ttf" | cut -d' ' -f1)"; fi
            [[ "$actual" == "$sha" ]] || { echo "::error::$slot sha256 does not match brand.lock.json"; exit 1; }
          done
          echo "ONEKEY_PRIVATE_FONTS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          env_file_name: '.env'
          sentry_project: 'desktop-winms'
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}
          sentry_dsn_react_native: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
          sentry_dsn_web: ${{ secrets.SENTRY_DSN_WEB }}
          sentry_dsn_desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry_dsn_mas: ${{ secrets.SENTRY_DSN_MAS }}
          sentry_dsn_snap: ${{ secrets.SENTRY_DSN_SNAP }}
          sentry_dsn_winms: ${{ secrets.SENTRY_DSN_WINMS }}
          sentry_dsn_ext: ${{ secrets.SENTRY_DSN_EXT }}

      - name: Warn if GPG verification is skipped
        if: ${{ env.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION == 'true' }}
        run: |
          Write-Host "::warning::GPG verification is SKIPPED for this build. This should only be used in CI/dev builds."

      - name: 'Setup ENV'
        run: |
          $pkg_version = node -e "console.log(require('./apps/desktop/package.json').version)"
          $pkg_version = $pkg_version.Trim()
          Write-Host "pkg_version=$pkg_version"
          "PKG_VERSION=$pkg_version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $artifacts_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          "ARTIFACTS_URL=$artifacts_url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: |
          node <<'NODE'
          // Match the repository's Yarn 4 cache path without executing checkout plugins.
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const base = process.platform === 'win32'
            ? path.join(process.env.LOCALAPPDATA || path.join(os.homedir(), 'AppData', 'Local'), 'Yarn', 'Berry')
            : process.env.XDG_DATA_HOME
              ? path.join(process.env.XDG_DATA_HOME, 'yarn', 'berry')
              : path.join(os.homedir(), '.yarn', 'berry');
          const cache = process.env.YARN_ENABLE_GLOBAL_CACHE === 'true'
            ? path.join(base, 'cache') : path.join(process.env.GITHUB_WORKSPACE, '.yarn', 'cache');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${cache}\narch=${process.arch}\n`);
          NODE

      - name: Restore Yarn cache from x
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        shell: pwsh
        run: echo "dir=${{ github.workspace }}/.yarn" >> $env:GITHUB_OUTPUT

      - name: Install Dep
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: |
          yarn install --immutable

      - name: Setup Code Signing file
        run: |
          [IO.File]::WriteAllBytes("apps/desktop/sign.p12", [Convert]::FromBase64String("${{ secrets.DESKTOP_KEYS_SECRET }}"))

      - name: Build and Sign Static Windows Installer
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          APPLEID: ${{ secrets.APPLEID }}
          APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
          ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          DESK_CHANNEL: ms-store
          CSC_LINK: './sign.p12'
        run: |
          cd apps/desktop
          yarn build:winms

      - name: Upload universal Windows Store exe
        uses: actions/upload-artifact@v4
        with:
          name: onekey-desktop-winms-universal-${{ env.BUILD_APP_VERSION }}-${{ env.BUILD_NUMBER }}-${{ env.BUILD_BUNDLE_VERSION }}-${{ github.sha }}
          path: |
            ./apps/desktop/build-electron/*.exe
            !./apps/desktop/build-electron/*-x64.exe
            !./apps/desktop/build-electron/*-arm64.exe

      - name: 'Notify to Slack'
        if: ${{ github.event.workflow_run }}
        uses: onekeyhq/actions/slack-notify-webhook@86ad045e18da7958f659995ee2f9df375dd03ef4 # pin to SHA
        with:
          web-hook-url: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
          secret-key: ${{ secrets.ACTION_SIGN_SECERT_KEY }}
          artifact-type: Desktop
          artifact-name: OneKey-Desktop-Win-Store
          artifact-bundle-id: 'so.onekey.wallet.desktop'
          artifact-version-name: '${{ env.BUILD_APP_VERSION }}@${{ env.BUILD_NUMBER }}'
          artifact-version-code: '${{ env.BUILD_NUMBER }}'
          artifact-download-url: '${{ env.ARTIFACTS_URL }}'
          artifact-skip-gpg: '${{ env.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION }}'
          artifact-bundle-version: '${{ env.BUILD_BUNDLE_VERSION }}'
