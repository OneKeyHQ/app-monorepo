name: 02-unittest
run-name: ${{ inputs.max_workers && format('Unit test worker benchmark ({0})', inputs.max_workers) || '' }}

on:
  workflow_dispatch:
    inputs:
      max_workers:
        description: Jest workers per shard (100% uses the runner CPU count)
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '100%'
  pull_request:
    branches:
      - onekey
      - x
      - hotfix/*
      - release/*
  push:
    branches:
      - onekey
      - x

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.max_workers || 'default' }}
  cancel-in-progress: true

env:
  YARN_ENABLE_GLOBAL_CACHE: true
  JEST_SHARD_TOTAL: 5
  JEST_COVERAGE_THRESHOLD_JSON: '{"statements":10,"branches":35,"functions":10}'

permissions:
  contents: read
  packages: read

jobs:
  unittest:
    name: Unit Tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-24.04
    # Manual benchmarks keep the slow baseline observable.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 30 || 10 }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          check-latest: true
          scope: '@onekeyhq'

      - name: Write unit test AI prompt
        run: |
          mkdir -p ci-ai
          node .github/scripts/ciFailureIssue.js prompt unittest > ci-ai/unittest-ai-prompt.md || \
            echo "AI prompt generation failed; inspect the failed step log and jest shard log." > ci-ai/unittest-ai-prompt.md

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dependency
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          yarn install --immutable

      - name: Run Tests
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          BENCHMARK_WORKERS: ${{ inputs.max_workers }}
        run: |
          mkdir -p ci-ai
          # Four workers exceeded prebundle test deadlines on the four-core runner.
          test_command=(yarn test --maxWorkers=3)
          if [ -n "$BENCHMARK_WORKERS" ]; then
            node <<'NODE' > ci-ai/runner.json
          const os = require('node:os');
          console.log(JSON.stringify({
            revision: process.env.GITHUB_SHA,
            node: process.version,
            workers: process.env.BENCHMARK_WORKERS,
            cpuCount: os.cpus().length,
            availableParallelism: os.availableParallelism(),
            memoryBytes: os.totalmem(),
          }, null, 2));
          NODE
            # Isolate transformations from the shared Yarn cache for a fair comparison.
            test_command=(/usr/bin/time -v -o ci-ai/resources.txt yarn test
              --maxWorkers="$BENCHMARK_WORKERS"
              --cacheDirectory="$RUNNER_TEMP/jest-worker-benchmark"
              --json --outputFile=ci-ai/test-results.json)
          fi
          set +e
          "${test_command[@]}" \
            --coverage \
            --shard="${{ matrix.shard }}/${JEST_SHARD_TOTAL}" \
            --coverageDirectory=coverage/shard-${{ matrix.shard }} \
            --coverageReporters=text \
            --coverageReporters=lcov \
            --coverageReporters=json-summary \
            --coverageReporters=json \
            --coverageThreshold='{}' \
            2>&1 | tee ci-ai/jest-shard-${{ matrix.shard }}.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload worker benchmark measurements
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: worker-benchmark-${{ inputs.max_workers }}-shard-${{ matrix.shard }}
          path: |
            ci-ai/runner.json
            ci-ai/resources.txt
            ci-ai/test-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ github.sha }}-shard-${{ matrix.shard }}-of-${{ env.JEST_SHARD_TOTAL }}
          path: test-report.html

      - name: Upload Coverage Shard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.sha }}-shard-${{ matrix.shard }}-of-${{ env.JEST_SHARD_TOTAL }}
          path: coverage/shard-${{ matrix.shard }}/
          if-no-files-found: error

      - name: Upload unit test AI diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-ai-unittest-diagnostics-shard-${{ matrix.shard }}-of-${{ env.JEST_SHARD_TOTAL }}
          path: |
            ci-ai/unittest-ai-prompt.md
            ci-ai/jest-shard-${{ matrix.shard }}.log
            test-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Explain unit test failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-unittest-diagnostics-shard-${{ matrix.shard }}-of-${{ env.JEST_SHARD_TOTAL }}\`"
            echo "- Open: \`jest-shard-${{ matrix.shard }}.log\`, \`test-report.html\`, and \`unittest-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-unittest-diagnostics-shard-${{ matrix.shard }}-of-${{ env.JEST_SHARD_TOTAL }} and inspect jest-shard-${{ matrix.shard }}.log"

  coverage:
    name: unittest (24.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: unittest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Check unit test shards
        run: |
          if [ "${{ needs.unittest.result }}" != "success" ]; then
            echo "::error::Unit test shard matrix result: ${{ needs.unittest.result }}"
            exit 1
          fi

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          check-latest: true

      - name: Download Coverage Shards
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-report-${{ github.sha }}-shard-*
          path: coverage-shards

      - name: Merge Coverage Reports
        run: |
          node development/scripts/merge-jest-coverage.js coverage-shards coverage "${JEST_SHARD_TOTAL}"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
