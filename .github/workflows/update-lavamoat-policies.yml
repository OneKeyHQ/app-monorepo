name: update-lavamoat-policies

on:
  issue_comment:
    types: created

concurrency:
  group: update-lavamoat-policies-${{ github.event.issue.number }}
  cancel-in-progress: true

# Keep the default token read-only. Write scopes are granted only to the
# apply-and-commit job after authorization and same-repository checks pass.
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '@onekeybot update-policies') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
    outputs:
      IS_CROSS_REPO_PR: ${{ steps.pr.outputs.IS_CROSS_REPO_PR }}
      HEAD_REF_NAME: ${{ steps.pr.outputs.HEAD_REF_NAME }}
      HEAD_SHA: ${{ steps.pr.outputs.HEAD_SHA }}
      IS_AUTHORIZED: ${{ steps.authorize.outputs.IS_AUTHORIZED }}
      RUN_ID: ${{ steps.find-ci-run.outputs.RUN_ID }}
      NO_CI_RUN: ${{ steps.find-ci-run.outputs.NO_CI_RUN }}
      VALIDATION_PENDING: ${{ steps.find-ci-run.outputs.VALIDATION_PENDING }}
      VALIDATION_SKIPPED: ${{ steps.find-ci-run.outputs.VALIDATION_SKIPPED }}
      VALIDATION_FAILED: ${{ steps.find-ci-run.outputs.VALIDATION_FAILED }}
      FAILED_JOBS: ${{ steps.find-ci-run.outputs.FAILED_JOBS }}
    steps:
      - name: Read pull request metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_METADATA=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json isCrossRepository,headRefName,headRefOid)
          IS_CROSS_REPO_PR=$(echo "${PR_METADATA}" | jq -r '.isCrossRepository')
          HEAD_REF_NAME=$(echo "${PR_METADATA}" | jq -r '.headRefName')
          HEAD_SHA=$(echo "${PR_METADATA}" | jq -r '.headRefOid')
          echo "IS_CROSS_REPO_PR=${IS_CROSS_REPO_PR}" >> "$GITHUB_OUTPUT"
          echo "HEAD_REF_NAME=${HEAD_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check comment author permission
        id: authorize
        env:
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "${COMMENT_AUTHOR_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "IS_AUTHORIZED=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "IS_AUTHORIZED=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: React to the comment
        if: ${{ steps.authorize.outputs.IS_AUTHORIZED == 'true' && steps.pr.outputs.IS_CROSS_REPO_PR == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1'

      - name: Find LavaMoat validation run for PR head commit
        if: ${{ steps.authorize.outputs.IS_AUTHORIZED == 'true' && steps.pr.outputs.IS_CROSS_REPO_PR == 'false' }}
        id: find-ci-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pr.outputs.HEAD_SHA }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=validate-lavamoat-policies.yml \
            --repo "${REPO}" \
            --commit="${HEAD_SHA}" \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "NO_CI_RUN=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JOBS_JSON=$(gh run view "${RUN_ID}" \
            --repo "${REPO}" \
            --json jobs \
            --jq '[.jobs[] | select(.name | startswith("validate-lavamoat-policies"))]')
          JOB_COUNT=$(echo "$JOBS_JSON" | jq 'length')

          if [ "$JOB_COUNT" -eq 0 ]; then
            echo "VALIDATION_SKIPPED=true" >> "$GITHUB_OUTPUT"
            echo "RUN_ID=${RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PENDING=$(echo "$JOBS_JSON" | jq '[.[] | select(.status != "completed")] | length')
          if [ "$PENDING" -gt 0 ]; then
            echo "VALIDATION_PENDING=true" >> "$GITHUB_OUTPUT"
            echo "RUN_ID=${RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FAILED_JOBS=$(echo "$JOBS_JSON" | jq -r '[.[] | select(.conclusion != "success") | "- [" + .name + "](" + (.url // .html_url // "") + ") (" + (.conclusion // .status // "unknown") + ")"] | join("\n")')
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_OUTPUT"

          if [ -n "$FAILED_JOBS" ]; then
            echo "VALIDATION_FAILED=true" >> "$GITHUB_OUTPUT"
            {
              echo 'FAILED_JOBS<<EOF'
              echo "$FAILED_JOBS"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Comment when the author is not allowed to update policies
        if: ${{ steps.authorize.outputs.IS_AUTHORIZED == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "Only repository owners, members, or collaborators can trigger LavaMoat policy auto-updates."

      - name: Comment when cross-repo PR is unsupported
        if: ${{ steps.authorize.outputs.IS_AUTHORIZED == 'true' && steps.pr.outputs.IS_CROSS_REPO_PR == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "LavaMoat policy auto-update is disabled for cross-repository pull requests. Please run \`yarn lavamoat:policy:all\` locally and push the policy changes."

  report-ci-state:
    name: Report policy validation state
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.IS_AUTHORIZED == 'true' && needs.prepare.outputs.IS_CROSS_REPO_PR == 'false' && needs.prepare.outputs.VALIDATION_FAILED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      RUN_ID: ${{ needs.prepare.outputs.RUN_ID }}
      NO_CI_RUN: ${{ needs.prepare.outputs.NO_CI_RUN }}
      VALIDATION_PENDING: ${{ needs.prepare.outputs.VALIDATION_PENDING }}
      VALIDATION_SKIPPED: ${{ needs.prepare.outputs.VALIDATION_SKIPPED }}
    steps:
      - name: Post comment when no CI run was found
        if: ${{ env.NO_CI_RUN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "No LavaMoat validation run found for this commit. Please wait for CI to start and retry \`@onekeybot update-policies\`."

      - name: Post comment when validation is still running
        if: ${{ env.VALIDATION_PENDING == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "LavaMoat validation is still running. Please retry \`@onekeybot update-policies\` after CI completes."

      - name: Post comment when validation was skipped
        if: ${{ env.VALIDATION_SKIPPED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "LavaMoat validation was skipped in CI. Policies were not checked for this commit."

      - name: Post comment when there are no policy changes
        if: ${{ env.RUN_ID && env.VALIDATION_PENDING != 'true' && env.VALIDATION_SKIPPED != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "No LavaMoat policy changes."

  apply-and-commit:
    name: Apply policy diffs and commit
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.IS_AUTHORIZED == 'true' && needs.prepare.outputs.IS_CROSS_REPO_PR == 'false' && needs.prepare.outputs.VALIDATION_FAILED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This is the only job that can push policy updates back to a PR branch.
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      RUN_ID: ${{ needs.prepare.outputs.RUN_ID }}
      HEAD_REF_NAME: ${{ needs.prepare.outputs.HEAD_REF_NAME }}
      HEAD_SHA: ${{ needs.prepare.outputs.HEAD_SHA }}
      VALIDATION_FAILED: ${{ needs.prepare.outputs.VALIDATION_FAILED }}
      FAILED_JOBS: ${{ needs.prepare.outputs.FAILED_JOBS }}
      ACTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      USES_POLICY_UPDATE_BOT_TOKEN: ${{ secrets.ONEKEYBOT_GITHUB_TOKEN != '' }}
    steps:
      - name: Checkout repository
        if: ${{ env.VALIDATION_FAILED == 'true' }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONEKEYBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Warn when using GITHUB_TOKEN for policy updates
        if: ${{ env.VALIDATION_FAILED == 'true' && env.USES_POLICY_UPDATE_BOT_TOKEN != 'true' }}
        run: |
          echo "::warning::ONEKEYBOT_GITHUB_TOKEN is not configured. Falling back to GITHUB_TOKEN; the policy update push may not trigger follow-up workflows automatically."

      - name: Fetch pull request commit
        if: ${{ env.VALIDATION_FAILED == 'true' }}
        env:
          PUSH_TOKEN: ${{ secrets.ONEKEYBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Do not checkout the PR branch in this privileged issue_comment
          # workflow. Fetch objects only; apply the trusted CI patch to a
          # temporary git index and create the update commit with commit-tree.
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"
          git fetch --no-tags --depth=1 origin "+refs/heads/${HEAD_REF_NAME}:refs/remotes/origin/lavamoat-policy-update-head"

          FETCHED_SHA=$(git rev-parse refs/remotes/origin/lavamoat-policy-update-head)
          if [ "${FETCHED_SHA}" != "${HEAD_SHA}" ]; then
            echo "::error::Pull request head changed while applying LavaMoat policy diffs. Expected ${HEAD_SHA}, got ${FETCHED_SHA}."
            exit 1
          fi

      - name: Download policy diffs from validation CI
        if: ${{ env.VALIDATION_FAILED == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: lavamoat-policy-diffs
          pattern: lavamoat-policy-diff-*
          merge-multiple: true
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for policy diffs
        if: ${{ env.VALIDATION_FAILED == 'true' }}
        id: check-diffs
        run: |
          echo "HAS_DIFFS=$(compgen -G 'lavamoat-policy-diffs/*.patch' > /dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Apply policy diffs
        if: ${{ steps.check-diffs.outputs.HAS_DIFFS == 'true' }}
        env:
          GIT_AUTHOR_NAME: OneKey Bot
          GIT_AUTHOR_EMAIL: onekeybot@users.noreply.github.com
          GIT_COMMITTER_NAME: OneKey Bot
          GIT_COMMITTER_EMAIL: onekeybot@users.noreply.github.com
        run: |
          export GIT_INDEX_FILE="${RUNNER_TEMP}/lavamoat-policy-update.index"
          git read-tree "${HEAD_SHA}"

          for patch in lavamoat-policy-diffs/*.patch; do
            echo "Applying ${patch}..."
            git apply --cached --whitespace=error "${patch}"
          done
          rm -rf lavamoat-policy-diffs
          git diff --cached --name-status "${HEAD_SHA}"

          invalid_paths=()
          while IFS= read -r -d '' changed_path; do
            case "${changed_path}" in
              lavamoat/*) ;;
              *) invalid_paths+=("${changed_path}") ;;
            esac
          done < <(git diff --cached --name-only -z "${HEAD_SHA}")

          if [ "${#invalid_paths[@]}" -gt 0 ]; then
            printf '::error::LavaMoat policy update patch touched files outside lavamoat/: %s\n' "${invalid_paths[*]}"
            exit 1
          fi

          NEW_TREE=$(git write-tree)
          NEW_COMMIT=$(printf '%s\n' "chore: update LavaMoat policies" | git commit-tree "${NEW_TREE}" -p "${HEAD_SHA}")
          git push origin "${NEW_COMMIT}:refs/heads/${HEAD_REF_NAME}"

      - name: Post comment when policies were updated
        if: ${{ steps.check-diffs.outputs.HAS_DIFFS == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.ONEKEYBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${USES_POLICY_UPDATE_BOT_TOKEN}" = "true" ]; then
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "LavaMoat policies updated. Please review \`policy.json\` diffs and \`lavamoat/review/README.md\` before requesting security approval."
          else
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "LavaMoat policies updated with the default GITHUB_TOKEN. Please review \`policy.json\` diffs and \`lavamoat/review/README.md\`, then manually re-run or approve CI if no follow-up workflow starts automatically."
          fi

      - name: Post comment when validation failed without diffs
        if: ${{ !cancelled() && env.VALIDATION_FAILED == 'true' && steps.check-diffs.outputs.HAS_DIFFS != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'LavaMoat validation failed but no policy diffs were produced. This usually means artifact validation or the LavaMoat protected build failed, so the policy update bot cannot fix it automatically.\n\nFailed jobs:\n%s' "$FAILED_JOBS" | gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file -

      - name: Post comment if the update failed
        if: ${{ failure() && !(env.VALIDATION_FAILED == 'true' && steps.check-diffs.outputs.HAS_DIFFS != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "Policy update failed. Review the workflow logs and retry: ${ACTION_RUN_URL}"
