          path: ${{ steps.yarn-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-

      - name: Install Dependencies
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=8192'
        uses: ./.github/actions/install-dependencies

      - name: Build desktop renderer budget artifact with release Rspack config
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: yarn workspace @onekeyhq/desktop build:renderer:startup-budget

      - name: Check desktop renderer startup graph budget
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: yarn workspace @onekeyhq/desktop check:renderer-startup-budget web-build

      - name: Build desktop main with esbuild metafile
        env:
          ESBUILD_METAFILE: '1'
          NODE_ENV: production
        run: yarn workspace @onekeyhq/desktop build:main

      - name: Check desktop main/preload bundle budget
        run: yarn workspace @onekeyhq/desktop check:main-bundle-budget

      - name: Upload desktop startup budget reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-budget-reports
          path: |
            apps/desktop/out-dir-analysis/desktop-renderer-startup-graph-budget-report.json
            apps/desktop/out-dir-analysis/desktop-main-bundle-budget-report.json
            apps/desktop/app/dist/meta.json
          retention-days: 30

      - name: Unmount dependency image
        if: always() && steps.dependencies.outcome != 'skipped'
        run: python3 .github/scripts/ci-dependencies.py cleanup

  ext-build-budget:
    name: Extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
