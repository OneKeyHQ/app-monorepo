name: 01-lint

on:
  pull_request:
    branches:
      - onekey
      - x
      - hotfix/*
      - release/*
  push:
    branches:
      - onekey
      - x

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    # About eight minutes of checks plus six minutes for a cold install and margin.
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          check-latest: true
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: |
          node <<'NODE'
          // Match the repository's Yarn 4 cache path without executing checkout plugins.
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const base = process.platform === 'win32'
            ? path.join(process.env.LOCALAPPDATA || path.join(os.homedir(), 'AppData', 'Local'), 'Yarn', 'Berry')
            : process.env.XDG_DATA_HOME
              ? path.join(process.env.XDG_DATA_HOME, 'yarn', 'berry')
              : path.join(os.homedir(), '.yarn', 'berry');
          const cache = process.env.YARN_ENABLE_GLOBAL_CACHE === 'true'
            ? path.join(base, 'cache') : path.join(process.env.GITHUB_WORKSPACE, '.yarn', 'cache');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${cache}\narch=${process.arch}\n`);
          NODE

      - name: Restore Yarn cache from x
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-

      - name: Write lint AI prompt
        run: |
          mkdir -p ci-ai
          node .github/scripts/ciFailureIssue.js prompt lint > ci-ai/lint-ai-prompt.md || \
            echo "AI prompt generation failed; inspect the failed step log and lint-output.log." > ci-ai/lint-ai-prompt.md

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dependency
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        uses: ./.github/actions/install-dependencies

      - name: Test dependency snapshot lifecycle
        env:
          CI_DEPENDENCY_INTEGRATION: 'true'
        run: python3 .github/scripts/ci-dependencies-test.py

      - name: Check third-party native storage compatibility
        run: yarn check:third-party-native-storage

      - name: Run lint
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          mkdir -p ci-ai
          set +e
          (
            sample_cgroup() {
              local scope="$1" directory="$2" file
              for file in memory.current memory.max memory.peak memory.events memory.events.local; do
                printf 'cgroup %s %s:\n' "$scope" "$file"
                if [[ -r "$directory/$file" ]]; then
                  cat "$directory/$file"
                else
                  printf 'unavailable\n'
                fi
              done
            }
            while true; do
              {
                printf 'UTC: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
                if [[ -r /proc/meminfo ]]; then
                  awk '/^(MemAvailable|SwapFree):/ { sub(/:/, "", $1); printf "%s=%s kB\n", $1, $2 }' /proc/meminfo
                else
                  printf 'MemAvailable/SwapFree: unavailable\n'
                fi
                if [[ -r /proc/pressure/memory ]]; then
                  printf 'memory pressure:\n'
                  cat /proc/pressure/memory
                else
                  printf 'memory pressure: unavailable\n'
                fi
                cgroup_relative=$(awk -F: '$1 == "0" { print $3; exit }' /proc/self/cgroup 2>/dev/null)
                sample_cgroup current "/sys/fs/cgroup${cgroup_relative}"
                sample_cgroup root /sys/fs/cgroup
                printf 'process count: %s\n' "$(ps -e -o pid= | wc -l)"
                printf 'top RSS (PID PPID COMM RSS_KB):\n'
                ps -e -o pid=,ppid=,comm=,rss= | sort -k4,4nr | awk 'NR <= 10'
              } 2>&1 | tee -a ci-ai/lint-resources.log
              sleep 15
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          yarn lint 2>&1 | tee ci-ai/lint-output.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Test developer scripts
        run: >-
          node --test
          development/scripts/command-batches.node-test.js
          development/scripts/run-ios-account-switch-heating-repro.node-test.js
          development/lint/background-api-contract.node-test.js
          development/lint/test-integrity.node-test.js
          development/lint/onekeyfe-patches.node-test.js
          apps/cli/esbuild.config.node-test.js
          apps/mobile/scripts/check-third-party-async-storage.node-test.js
          apps/mobile/scripts/native-storage-metro-policy.node-test.js

      - name: Build CLI
        run: yarn workspace @onekeyfe/cli build

      - name: Upload lint AI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ai-lint-diagnostics
          path: |
            ci-ai/lint-ai-prompt.md
            ci-ai/lint-output.log
            ci-ai/lint-resources.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain lint failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-lint-diagnostics\`"
            echo "- Open: \`lint-output.log\` and \`lint-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-lint-diagnostics and inspect lint-output.log"

      - name: Unmount dependency image
        if: always() && steps.dependencies.outcome != 'skipped'
        run: python3 .github/scripts/ci-dependencies.py cleanup
