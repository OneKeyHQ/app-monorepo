name: 01-lint

on:
  pull_request:
    branches:
      - onekey
      - x
      - hotfix/*
      - release/*
  push:
    branches:
      - onekey
      - x

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  # Single sequential job: install dependencies once, then run tsc, the standard
  # oxlint pass, the type-aware oxlint pass, oxfmt, and the lightweight checks in
  # one process chain. Each heavy step peaks at ~7-10 GB RSS on a 16 GB runner,
  # so they must not run concurrently; keeping them in one job pays the ~1-3.5 min
  # dependency install once instead of once per job.
  lint:
    name: lint (${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    # About eleven minutes of checks plus six minutes for a cold install and margin.
    timeout-minutes: 25

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          check-latest: true
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Write lint AI prompt
        run: |
          mkdir -p ci-ai
          node .github/scripts/ciFailureIssue.js prompt lint > ci-ai/lint-ai-prompt.md || \
            echo "AI prompt generation failed; inspect the failed step log and lint-output.log." > ci-ai/lint-ai-prompt.md

      - name: Install Dependency
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        uses: ./.github/actions/install-dependencies

      # development/lint/ts.js writes the tsgo incremental build info into the
      # Yarn cache folder; restore the latest copy so tsc only rechecks changes.
      - name: Locate TypeScript build info
        id: tsc-cache
        run: echo "path=$(yarn config get cacheFolder)/.app-mono-ts-cache" >> "$GITHUB_OUTPUT"

      - name: Restore TypeScript build info
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ${{ steps.tsc-cache.outputs.path }}
          key: tsc-buildinfo-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            tsc-buildinfo-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
            tsc-buildinfo-${{ runner.os }}-

      - name: Verify locked EAS CLI
        working-directory: .github/tools/eas-cli
        run: |
          node ../../../.yarn/releases/yarn-4.18.1.cjs install --immutable
          node node_modules/eas-cli/bin/run --version

      - name: Check release supply chain
        run: |
          node .github/scripts/check-release-supply-chain.js
          node --test .github/scripts/check-release-supply-chain.node-test.js .github/scripts/mobile-release.node-test.js .github/scripts/eas-cli-compat.node-test.js
          node_modules/.bin/sentry-cli --version
          yarn workspace @onekeyhq/desktop exec electron-builder --version

      - name: Test dependency snapshot lifecycle
        env:
          CI_DEPENDENCY_INTEGRATION: 'true'
        run: python3 .github/scripts/ci-dependencies-test.py

      - name: Verify App-owned icon resources
        run: |
          yarn icon:build
          yarn workspace @onekeyhq/components icon:check
          node --test development/onekey-icons/generate-icons.test.mjs packages/components/src/primitives/Icon/script.node-test.js
          git diff --exit-code -- packages/components/src/primitives/Icon/Icons.tsx

      - name: Check third-party native storage compatibility
        run: yarn check:third-party-native-storage

      # Runs, in order: tsc (tsgo) -> standard oxlint pass + oxfmt -> type-aware
      # oxlint pass -> lightweight concurrent checks. No ONEKEY_OXLINT_PASS or
      # ONEKEY_LINT_SKIP_TSC override, so this is the full local `yarn lint`.
      - name: Run lint
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          mkdir -p ci-ai
          set +e
          yarn lint 2>&1 | tee ci-ai/lint-output.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      # Save even when lint fails: tsc validates every file by content hash
      # before reusing cached results, so partial build info stays valid.
      - name: Save TypeScript build info
        if: always() && steps.tsc-cache.outputs.path != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ${{ steps.tsc-cache.outputs.path }}
          key: tsc-buildinfo-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}

      - name: Test developer scripts
        run: >-
          node --test
          development/scripts/command-batches.node-test.js
          development/scripts/fonts-sync.node-test.js
          development/scripts/run-ios-account-switch-heating-repro.node-test.js
          development/scripts/tamagui-animation-initial-style.node-test.js
          development/lint/eslint.node-test.js
          development/lint/background-api-contract.node-test.js
          development/lint/test-integrity.node-test.js
          development/lint/onekeyfe-patches.node-test.js
          development/lint/external-sdk.node-test.js
          apps/cli/esbuild.config.node-test.js
          apps/mobile/scripts/check-third-party-async-storage.node-test.js
          apps/mobile/scripts/native-storage-metro-policy.node-test.js

      - name: Test JPush native SDK patchers
        run: python3 -B apps/mobile/scripts/__tests__/patch-jpush-sdks.test.py

      - name: Build CLI
        run: yarn workspace @onekeyfe/cli build

      - name: Upload lint AI diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-ai-lint-diagnostics
          path: |
            ci-ai/lint-ai-prompt.md
            ci-ai/lint-output.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain lint failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-lint-diagnostics\`"
            echo "- Open: \`lint-output.log\` and \`lint-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-lint-diagnostics and inspect lint-output.log"

      - name: Unmount dependency image
        if: always() && steps.dependencies.outcome != 'skipped'
        run: python3 .github/scripts/ci-dependencies.py cleanup
