name: release-app-bundles

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build (optional, builds from PR head ref)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  # Required by the reusable workflow `release-native-bundle.yml`, which
  # declares its own `permissions:` block. When a reusable workflow requests
  # a permission the caller did not grant, GitHub blocks the call with
  # "Invalid workflow file ... is requesting 'X: read', but is only allowed
  # 'X: none'" before any job starts. Mirror its scopes here so the iOS /
  # Android slots actually launch:
  #   - packages: read  → yarn install from npm.pkg.github.com inside the
  #     reusable workflow.
  #   - actions: read   → the reusable workflow reads
  #     github.event.workflow_run metadata even when invoked via workflow_call
  #     so it can format build summaries consistently.
  packages: read
  actions: read

jobs:
  validate-pr:
    if: ${{ inputs.pr_number }}
    runs-on: ubuntu-24.04
    outputs:
      head_sha: ${{ steps.pr-info.outputs.head_sha }}
      head_ref: ${{ steps.pr-info.outputs.head_ref }}
    steps:
      - name: Validate PR and extract metadata
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TRUSTED_PR_AUTHORS: ${{ vars.TRUSTED_PR_AUTHORS }}
        run: |
          PR_DATA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '{head_repo: .head.repo.full_name, base_repo: .base.repo.full_name, author: .user.login, head_sha: .head.sha, head_ref: .head.ref, base_ref: .base.ref}')

          HEAD_REPO=$(echo "$PR_DATA" | jq -r '.head_repo')
          BASE_REPO=$(echo "$PR_DATA" | jq -r '.base_repo')
          AUTHOR=$(echo "$PR_DATA" | jq -r '.author')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head_sha')
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.head_ref')
          BASE_REF=$(echo "$PR_DATA" | jq -r '.base_ref')

          echo "PR #$PR_NUMBER: head=$HEAD_REPO, base=$BASE_REPO, author=$AUTHOR"
          echo "  head_sha=$HEAD_SHA, head_ref=$HEAD_REF, base_ref=$BASE_REF"

          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            # Fork PR — check if author is in the trusted whitelist
            if [[ ! ",$TRUSTED_PR_AUTHORS," == *",$AUTHOR,"* ]]; then
              echo "::error::PR #$PR_NUMBER is from a fork by @$AUTHOR who is not in TRUSTED_PR_AUTHORS. Configure the whitelist in repository variables."
              exit 1
            fi
            echo "::notice::PR #$PR_NUMBER is from a trusted fork ($HEAD_REPO) by whitelisted author @$AUTHOR — allowed."
          fi

          # Check PR is up-to-date with base branch
          BEHIND_BY=$(gh api "repos/${{ github.repository }}/compare/${BASE_REF}...${HEAD_SHA}" \
            --jq '.behind_by')

          if ! [[ "$BEHIND_BY" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to determine behind_by from compare API."
            exit 1
          fi

          if [ "$BEHIND_BY" -gt 0 ]; then
            echo "::error::PR #$PR_NUMBER is behind $BASE_REF by $BEHIND_BY commits. Please rebase before building."
            exit 1
          fi

          echo "::notice::PR #$PR_NUMBER is up-to-date with $BASE_REF."

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

          echo "PR #$PR_NUMBER validated successfully."

  prepare-params:
    needs: [validate-pr]
    if: ${{ always() && (needs.validate-pr.result == 'success' || needs.validate-pr.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      build_number: ${{ steps.params.outputs.build_number }}
      build_bundle_version: ${{ steps.params.outputs.build_bundle_version }}
      build_source: ${{ steps.params.outputs.build_source }}
      branch: ${{ steps.params.outputs.branch }}
      commit: ${{ steps.params.outputs.commit }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        if: ${{ !inputs.pr_number }}

      - name: Checkout PR head commit (pinned to validated SHA)
        if: ${{ inputs.pr_number }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-pr.outputs.head_sha }}

      - name: Generate build parameters
        id: params
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ needs.validate-pr.outputs.head_ref }}
        run: |
          # Read BUILD_NUMBER from .env.version
          BUILD_NUMBER=""
          BUILD_SOURCE="bundle-dev"
          if [ -f .env.version ]; then
            BUILD_NUMBER=$(grep -E '^BUILD_NUMBER=' .env.version | cut -d '=' -f 2 || true)
          fi

          if [ -n "$BUILD_NUMBER" ]; then
            echo "Found BUILD_NUMBER in .env.version: $BUILD_NUMBER"
            BUILD_SOURCE="bundle-release"
          else
            # Fallback: bundle-dev format 10YYMMDDxx — the leading "10"
            # explicitly marks the build as manual / PR-triggered so it's
            # visually distinguishable from daily-build's YYYYMMDDxx in QA
            # CDN listings, Slack notifications, Sentry release names, and
            # Android versionCode bumps. Diverging the prefix is the point.
            #
            # Total 10 digits; max value 1099123199 stays inside Android
            # versionCode's int32 cap (2147483647).
            DATE=$(date -u "+%y%m%d")
            RUN_MOD=$(( $GITHUB_RUN_NUMBER % 100 ))
            RUN_MOD=$(printf "%02d" $RUN_MOD)
            BUILD_NUMBER="10${DATE}${RUN_MOD}"
            echo "Generated BUILD_NUMBER: $BUILD_NUMBER"
          fi

          # Generate BUILD_BUNDLE_VERSION: seconds since 2026-01-01T00:00:00Z
          EPOCH_2026=$(date -u -d '2026-01-01T00:00:00' +%s 2>/dev/null || date -u -j -f '%Y-%m-%dT%H:%M:%S' '2026-01-01T00:00:00' +%s)
          NOW=$(date -u +%s)
          BUILD_BUNDLE_VERSION=$(( NOW - EPOCH_2026 ))

          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "build_bundle_version=$BUILD_BUNDLE_VERSION" >> $GITHUB_OUTPUT
          echo "build_source=$BUILD_SOURCE" >> $GITHUB_OUTPUT
          if [ -n "$PR_NUMBER" ]; then
            BRANCH="$HEAD_REF"
            COMMIT=$(git rev-parse HEAD)
          else
            BRANCH="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

          echo "Summary:"
          echo "  BUILD_NUMBER=$BUILD_NUMBER"
          echo "  BUILD_BUNDLE_VERSION=$BUILD_BUNDLE_VERSION"
          echo "  BUILD_SOURCE=$BUILD_SOURCE"
          echo "  BRANCH=$BRANCH"
          echo "  COMMIT=$COMMIT"

  # Pre-build the web-embed Rspack bundle ONCE here, then both
  # native-bundle-ios and native-bundle-android download the same artifact.
  # Avoids the duplicate web-embed-build that would otherwise show up under
  # each native-bundle-* slot when each workflow_call ran its own internal
  # build.
  web-embed-build:
    needs: prepare-params
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.value }}
    steps:
      - name: Compute artifact name
        id: artifact-name
        # Distinct from any naming used inside release-native-bundle.yml so
        # callers / consumers can't collide with internal artifacts.
        run: echo "value=web-embed-build-app-bundles-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ needs.prepare-params.outputs.commit }}

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          checkout_ref: ${{ needs.prepare-params.outputs.commit }}
          env_file_name: '.env'
          sentry_project: 'react-native'
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}
          sentry_dsn_react_native: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
          sentry_dsn_web: ${{ secrets.SENTRY_DSN_WEB }}
          sentry_dsn_desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry_dsn_mas: ${{ secrets.SENTRY_DSN_MAS }}
          sentry_dsn_snap: ${{ secrets.SENTRY_DSN_SNAP }}
          sentry_dsn_winms: ${{ secrets.SENTRY_DSN_WINMS }}
          sentry_dsn_ext: ${{ secrets.SENTRY_DSN_EXT }}

      - name: Override params from prepare-params
        run: |
          echo "BUILD_NUMBER=${{ needs.prepare-params.outputs.build_number }}" >> $GITHUB_ENV
          echo "BUILD_BUNDLE_VERSION=${{ needs.prepare-params.outputs.build_bundle_version }}" >> $GITHUB_ENV
          sed -i "s/^BUNDLE_VERSION=.*/BUNDLE_VERSION=${{ needs.prepare-params.outputs.build_bundle_version }}/" .env
          sed -i "s/^CI_BUILD_NUMBER=.*/CI_BUILD_NUMBER=${{ needs.prepare-params.outputs.build_number }}/" .env

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Install Dep
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: yarn install --immutable

      - name: Build web-embed bundle
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          NODE_ENV: production
          SENTRY_UPLOAD_BY_CLI: 'true'
          WEB_EMBED_SKIP_POSTBUILD: 'true'
        run: yarn workspace @onekeyhq/web-embed build

      - name: Upload Web-embed Sourcemaps to Sentry
        id: upload_web_embed_sourcemaps
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: onekey-bb
          SENTRY_PROJECT: react-native
          BUILD_APP_VERSION: ${{ env.BUILD_APP_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No SENTRY_AUTH_TOKEN - skipping web-embed sourcemap upload."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE="$BUILD_APP_VERSION ($BUILD_NUMBER)"
          # Sentry expects a literal tilde URL prefix.
          # shellcheck disable=SC2088
          URL_PREFIX='~/web-embed'
          npx sentry-cli releases new "$RELEASE" || true
          if [ -f ./apps/web-embed/scripts/check-browser-compat.js ]; then
            if ! npx sentry-cli sourcemaps inject ./apps/web-embed/web-build; then
              echo "::warning::Web-embed Sentry debug-id injection failed; continuing with release-based upload."
            fi
          else
            echo "::notice::Skipping Sentry debug-id injection for a legacy checkout without the post-injection browser compatibility check."
          fi
          if npx sentry-cli sourcemaps upload --release "$RELEASE" --url-prefix "$URL_PREFIX" ./apps/web-embed/web-build; then
            npx sentry-cli releases finalize "$RELEASE" || true
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Web-embed Sentry sourcemap upload failed; archiving sourcemaps before stripping them."
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify injected Web-embed Chromium 67 compatibility
        run: |
          if [ -f ./apps/web-embed/scripts/check-browser-compat.js ]; then
            node ./apps/web-embed/scripts/check-browser-compat.js
          else
            echo "::notice::Skipping the Chromium 67 compatibility check for a legacy checkout."
          fi

      - name: Upload Web-embed Sourcemap Diagnostic Artifact
        if: always() && steps.upload_web_embed_sourcemaps.outputs.uploaded != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-embed-sourcemaps-${{ github.sha }}
          path: |
            ./apps/web-embed/web-build/**/*.js.map
            ./apps/web-embed/web-build/**/*.css.map
          if-no-files-found: ignore
          retention-days: 30

      - name: Finalize Web-embed Production Assets
        if: always()
        run: |
          if [ -f ./apps/web-embed/scripts/finalize-production-assets.js ]; then
            node ./apps/web-embed/scripts/finalize-production-assets.js --strip-only
          else
            echo "::notice::Using legacy web-embed production asset cleanup."
            find ./apps/web-embed/web-build -type f \( \
              -name '*.css.map' -o \
              -name '*.js.map' -o \
              -name '*.LICENSE.txt' \
            \) -print -delete
            if find ./apps/web-embed/web-build -type f \( \
              -name '*.css.map' -o \
              -name '*.js.map' -o \
              -name '*.LICENSE.txt' \
            \) -print -quit | grep -q .; then
              echo "::error::Legacy web-embed production asset cleanup left sourcemap or license files behind."
              exit 1
            fi
          fi

      - name: Upload web-embed artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: |
            apps/web-embed/web-build
            !**/.DS_Store
          if-no-files-found: error
          retention-days: 1

  desktop-bundle:
    needs: prepare-params
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-desktop-bundle.yml
    with:
      build_number: ${{ needs.prepare-params.outputs.build_number }}
      build_bundle_version: ${{ needs.prepare-params.outputs.build_bundle_version }}
      build_source: ${{ needs.prepare-params.outputs.build_source }}
      branch: ${{ needs.prepare-params.outputs.branch }}
      commit: ${{ needs.prepare-params.outputs.commit }}
      checkout_ref: ${{ needs.prepare-params.outputs.commit }}
    secrets:
      COVALENT_KEY: ${{ secrets.COVALENT_KEY }}
      SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      SENTRY_DSN_REACT_NATIVE: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
      SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
      SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
      SENTRY_DSN_MAS: ${{ secrets.SENTRY_DSN_MAS }}
      SENTRY_DSN_SNAP: ${{ secrets.SENTRY_DSN_SNAP }}
      SENTRY_DSN_WINMS: ${{ secrets.SENTRY_DSN_WINMS }}
      SENTRY_DSN_EXT: ${{ secrets.SENTRY_DSN_EXT }}
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
      QA_JS_BUNDLE_SERVER_URL: ${{ secrets.QA_JS_BUNDLE_SERVER_URL }}
      QA_JS_BUNDLE_UPLOAD_SECRET: ${{ secrets.QA_JS_BUNDLE_UPLOAD_SECRET }}
      SLACK_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
      ACTION_SIGN_SECERT_KEY: ${{ secrets.ACTION_SIGN_SECERT_KEY }}

  # iOS and Android bundles are exposed as sibling top-level slots so the
  # orchestrator UI shows them alongside desktop-bundle / web-bundle. Each
  # call passes a `platform` input that narrows the matrix in
  # release-native-bundle.yml to a single platform. Both jobs run in
  # parallel — a failure in one does not block the other.
  native-bundle-ios:
    needs: [prepare-params, web-embed-build]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-native-bundle.yml
    with:
      platform: ios
      web_embed_artifact: ${{ needs.web-embed-build.outputs.artifact_name }}
      build_number: ${{ needs.prepare-params.outputs.build_number }}
      build_bundle_version: ${{ needs.prepare-params.outputs.build_bundle_version }}
      build_source: ${{ needs.prepare-params.outputs.build_source }}
      branch: ${{ needs.prepare-params.outputs.branch }}
      commit: ${{ needs.prepare-params.outputs.commit }}
      checkout_ref: ${{ needs.prepare-params.outputs.commit }}
    secrets:
      COVALENT_KEY: ${{ secrets.COVALENT_KEY }}
      SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      SENTRY_DSN_REACT_NATIVE: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
      SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
      SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
      SENTRY_DSN_MAS: ${{ secrets.SENTRY_DSN_MAS }}
      SENTRY_DSN_SNAP: ${{ secrets.SENTRY_DSN_SNAP }}
      SENTRY_DSN_WINMS: ${{ secrets.SENTRY_DSN_WINMS }}
      SENTRY_DSN_EXT: ${{ secrets.SENTRY_DSN_EXT }}
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
      QA_JS_BUNDLE_SERVER_URL: ${{ secrets.QA_JS_BUNDLE_SERVER_URL }}
      QA_JS_BUNDLE_UPLOAD_SECRET: ${{ secrets.QA_JS_BUNDLE_UPLOAD_SECRET }}
      SLACK_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
      ACTION_SIGN_SECERT_KEY: ${{ secrets.ACTION_SIGN_SECERT_KEY }}

  native-bundle-android:
    needs: [prepare-params, web-embed-build]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-native-bundle.yml
    with:
      platform: android
      web_embed_artifact: ${{ needs.web-embed-build.outputs.artifact_name }}
      build_number: ${{ needs.prepare-params.outputs.build_number }}
      build_bundle_version: ${{ needs.prepare-params.outputs.build_bundle_version }}
      build_source: ${{ needs.prepare-params.outputs.build_source }}
      branch: ${{ needs.prepare-params.outputs.branch }}
      commit: ${{ needs.prepare-params.outputs.commit }}
      checkout_ref: ${{ needs.prepare-params.outputs.commit }}
    secrets:
      COVALENT_KEY: ${{ secrets.COVALENT_KEY }}
      SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      SENTRY_DSN_REACT_NATIVE: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
      SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
      SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
      SENTRY_DSN_MAS: ${{ secrets.SENTRY_DSN_MAS }}
      SENTRY_DSN_SNAP: ${{ secrets.SENTRY_DSN_SNAP }}
      SENTRY_DSN_WINMS: ${{ secrets.SENTRY_DSN_WINMS }}
      SENTRY_DSN_EXT: ${{ secrets.SENTRY_DSN_EXT }}
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
      QA_JS_BUNDLE_SERVER_URL: ${{ secrets.QA_JS_BUNDLE_SERVER_URL }}
      QA_JS_BUNDLE_UPLOAD_SECRET: ${{ secrets.QA_JS_BUNDLE_UPLOAD_SECRET }}
      SLACK_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
      ACTION_SIGN_SECERT_KEY: ${{ secrets.ACTION_SIGN_SECERT_KEY }}

  web-bundle:
    needs: prepare-params
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/release-web.yml
    with:
      build_number: ${{ needs.prepare-params.outputs.build_number }}
      build_bundle_version: ${{ needs.prepare-params.outputs.build_bundle_version }}
      build_source: ${{ needs.prepare-params.outputs.build_source }}
      branch: ${{ needs.prepare-params.outputs.branch }}
      commit: ${{ needs.prepare-params.outputs.commit }}
      checkout_ref: ${{ needs.prepare-params.outputs.commit }}
      skip_pages_deploy: true
      test_endpoint: app-bundle.onekeytest.com
    secrets:
      COVALENT_KEY: ${{ secrets.COVALENT_KEY }}
      SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      SENTRY_DSN_REACT_NATIVE: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
      SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
      SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
      SENTRY_DSN_MAS: ${{ secrets.SENTRY_DSN_MAS }}
      SENTRY_DSN_SNAP: ${{ secrets.SENTRY_DSN_SNAP }}
      SENTRY_DSN_WINMS: ${{ secrets.SENTRY_DSN_WINMS }}
      SENTRY_DSN_EXT: ${{ secrets.SENTRY_DSN_EXT }}
      SLACK_NOTIFICATION_WEBHOOK: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
      ACTION_SIGN_SECERT_KEY: ${{ secrets.ACTION_SIGN_SECERT_KEY }}
