          sed -i "s/^GITHUB_SHA=.*/GITHUB_SHA=$COMMIT/" .env
          echo "GITHUB_SHA=$COMMIT" >> $GITHUB_ENV
          echo "WORKFLOW_GITHUB_SHA=$COMMIT" >> $GITHUB_ENV
          echo "WORKFLOW_GITHUB_SHA=$COMMIT" >> .env
          # Override PUBLIC_URL with resolved commit (replaces github.sha set by Setup ENV)
          echo "PUBLIC_URL=https://app-assets.onekey.so/${COMMIT}-${{ env.BUILD_NUMBER }}/" >> $GITHUB_ENV

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dependency
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        uses: ./.github/actions/install-dependencies

      - name: Build Target
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          MARKET_HOME_TOKEN_SEED_ENV: 'production'
          MARKET_HOME_TOKEN_SEED_REQUIRED: '1'
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: |
          yarn app:web:build

      - name: Verify Service Worker Bundle
        run: node apps/web/scripts/validate-built-service-worker.mjs

      - name: Verify Market Bootstrap Data
        run: |
          grep -q "__ONEKEY_BOOTSTRAP_DATA__" apps/web/web-build/index.html
          grep -q "__ONEKEY_BOOTSTRAP_DATA__" apps/web/web-build/404.html

      # rspack (unlike the old webpack build) has no in-build Sentry plugin, so
      # sourcemaps are uploaded here via sentry-cli and then deleted from the
      # shipped artifact. Mirrors the webpack sentryWebpackPlugin behaviour
      # (upload + filesToDeleteAfterUpload). Guarded: skips upload if no token.
      - name: Upload Web Sourcemaps to Sentry
        id: upload_web_sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: onekey-bb
          SENTRY_PROJECT: web
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No SENTRY_AUTH_TOKEN — skipping sourcemap upload."
            # Signal the cleanup step that no upload happened, so it KEEPS the
            # .map files in the artifact as an offline symbolication fallback.
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASE="${{ env.BUILD_APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          npx sentry-cli releases new "$RELEASE" || true
          # IMPORTANT: do NOT run `sourcemaps inject` here. inject rewrites the
          # built .js files in place (prepends a _sentryDebugIds IIFE + appends
          # //# debugId), which would invalidate the sha384 Subresource
          # Integrity hashes rspack already baked into index.html at build time.
          # Served cross-origin (app-assets.onekey.so) with crossorigin=anonymous
          # the browser would hard-block every script -> blank app. Use
          # release-based upload (no source-file mutation) so SRI stays valid.
          # Derive the artifact url-prefix from PUBLIC_URL so it matches how the
          # assets are ACTUALLY served. With no debug-ids, Sentry associates maps
          # purely by release + path: it strips the host from the event abs_path
          # and prepends `~`, so the uploaded prefix MUST carry the same path
          # segment. PUBLIC_URL is `https://<host>/[<commit>-<build>/]`; keep its
          # path (with trailing slash) after `~`. A bare `~/` (no path) was the
          # old value and stays correct when PUBLIC_URL has no path segment.
          # Without this the maps upload as `~/static/js/*.js` while events report
          # `~/<commit>-<build>/static/js/*.js` -> orphaned maps, minified stacks.
          URL_PREFIX="~$(printf '%s' "$PUBLIC_URL" | sed -E 's#^https?://[^/]+##')"
          npx sentry-cli sourcemaps upload --release "$RELEASE" --url-prefix "$URL_PREFIX" ./apps/web/web-build
          npx sentry-cli releases finalize "$RELEASE" || true
          # Upload succeeded (set -e would have aborted before here otherwise):
          # authorize the cleanup step to strip the now-redundant .map files.
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Cleanup Web Sourcemaps and License Files
        if: always()
        run: |
          # LICENSE banner files are never shipped, regardless of sourcemaps.
          find ./apps/web/web-build -name '*.LICENSE.txt' -type f -delete
          # Only strip .map files once they were actually uploaded to Sentry.
          # If the upload was skipped (no SENTRY_AUTH_TOKEN) or failed, KEEP the
          # maps in the artifact so the release stays symbolicable offline,
          # instead of shipping maps that are neither uploaded nor retained
          # (-> minified-only stacks for that release).
          if [ "${{ steps.upload_web_sourcemaps.outputs.uploaded }}" = "true" ]; then
            find ./apps/web/web-build \
              \( -name '*.js.map' -o -name '*.css.map' \) \
              -type f -delete
          else
            echo "Sourcemap upload skipped/failed — keeping .map files in artifact as fallback."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-monorepo-${{ env.COMMIT }}-${{ env.BUILD_NUMBER }}
          # Hidden files are allowed only at the two exact association paths below.
          include-hidden-files: true
          path: |
            # HTML entry points, icon, service worker and version manifest.
            ./apps/web/web-build/index.html
            ./apps/web/web-build/404.html
            ./apps/web/web-build/favicon.png
            ./apps/web/web-build/service-worker.js
            ./apps/web/web-build/sw-version-manifest.json
            # Root bundles/workers, CSS, WASM and the existing sourcemap fallback.
            # [!.] rejects dot-prefixed root filenames.
            ./apps/web/web-build/[!.]*.js
            ./apps/web/web-build/[!.]*.css
            ./apps/web/web-build/[!.]*.wasm
            ./apps/web/web-build/[!.]*.map
            # Resource directories produced by the Web build.
            ./apps/web/web-build/static/css/
            ./apps/web/web-build/static/js/
            ./apps/web/web-build/static/media/
            ./apps/web/web-build/static/canvaskit/
            ./apps/web/web-build/static/zxing/
            # Existing public iOS and Android association files; no directory glob.
            ./apps/web/web-build/.well-known/apple-app-site-association
            ./apps/web/web-build/.well-known/assetlinks.json
            # Exclude hidden files/directories beneath all selected public folders.
            !./apps/web/web-build/[!.]*/**/.*
            !./apps/web/web-build/[!.]*/**/.*/**
            # Exact association paths must be files, never directory descendants.
            !./apps/web/web-build/.well-known/apple-app-site-association/*
            !./apps/web/web-build/.well-known/assetlinks.json/*

      - name: Unmount dependency image
        if: always() && steps.dependencies.outcome != 'skipped'
        run: python3 .github/scripts/ci-dependencies.py cleanup

  notify:
    runs-on: ubuntu-24.04
    needs: [test-web, build-production]
    if: ${{ always() && (github.event.workflow_run || inputs.build_number) }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || '' }}

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          checkout_ref: ${{ inputs.checkout_ref || '' }}
          env_file_name: '.env'
          sentry_project: 'web'
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}
          sentry_dsn_react_native: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
          sentry_dsn_web: ${{ secrets.SENTRY_DSN_WEB }}
          sentry_dsn_desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry_dsn_mas: ${{ secrets.SENTRY_DSN_MAS }}
          sentry_dsn_snap: ${{ secrets.SENTRY_DSN_SNAP }}
          sentry_dsn_winms: ${{ secrets.SENTRY_DSN_WINMS }}
          sentry_dsn_ext: ${{ secrets.SENTRY_DSN_EXT }}

      - name: Setup ENV
        run: |
          artifacts_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "ARTIFACTS_URL=$artifacts_url" >> $GITHUB_ENV

      - name: Override params from caller
        if: ${{ inputs.build_number }}
        run: |
          echo "BUILD_NUMBER=${{ inputs.build_number }}" >> $GITHUB_ENV
          echo "BUILD_BUNDLE_VERSION=${{ inputs.build_bundle_version }}" >> $GITHUB_ENV
          sed -i "s/^BUNDLE_VERSION=.*/BUNDLE_VERSION=${{ inputs.build_bundle_version }}/" .env
          sed -i "s/^CI_BUILD_NUMBER=.*/CI_BUILD_NUMBER=${{ inputs.build_number }}/" .env

      - name: Resolve branch and commit
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_COMMIT: ${{ inputs.commit }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_BRANCH" ]; then
            BRANCH="$INPUT_BRANCH"
            COMMIT="$INPUT_COMMIT"
          elif [ -n "$WR_COMMIT" ]; then
            BRANCH="$WR_BRANCH"
            COMMIT="$WR_COMMIT"
          else
            BRANCH="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
          fi
          # Validate commit SHA format to prevent env injection
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Invalid commit SHA format: $COMMIT"
            exit 1
          fi
          DELIMITER=$(uuidgen)
          {
            echo "BRANCH<<${DELIMITER}"
            echo "$BRANCH"
            echo "${DELIMITER}"
          } >> "$GITHUB_ENV"
          {
            echo "COMMIT<<${DELIMITER}"
            echo "$COMMIT"
            echo "${DELIMITER}"
          } >> "$GITHUB_ENV"

      - name: 'Notify to Slack'
        uses: onekeyhq/actions/slack-notify-webhook@86ad045e18da7958f659995ee2f9df375dd03ef4 # pin to SHA
        with:
          web-hook-url: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
          secret-key: ${{ secrets.ACTION_SIGN_SECERT_KEY }}
          artifact-type: Web
          artifact-name: OneKey-Web
          artifact-bundle-id: 'so.onekey.wallet.web'
          artifact-version-name: '${{ env.BUILD_APP_VERSION }}@${{ env.BUILD_NUMBER }}'
          artifact-version-code: '${{ env.BUILD_NUMBER }}'
          artifact-download-url: '${{ env.ARTIFACTS_URL }}'
          artifact-skip-gpg: '${{ env.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION }}'
          artifact-bundle-version: '${{ env.BUILD_BUNDLE_VERSION }}'
          artifact-build-source: "${{ inputs.build_source || 'daily-build' }}"
          artifact-branch: '${{ env.BRANCH }}'
          artifact-commit: '${{ env.COMMIT }}'
