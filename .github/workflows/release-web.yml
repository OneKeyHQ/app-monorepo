          if [ -n "$INPUT_BRANCH" ]; then
            BRANCH="$INPUT_BRANCH"
            COMMIT="$INPUT_COMMIT"
          elif [ -n "$WR_COMMIT" ]; then
            BRANCH="$WR_BRANCH"
            COMMIT="$WR_COMMIT"
          else
            BRANCH="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
          fi
