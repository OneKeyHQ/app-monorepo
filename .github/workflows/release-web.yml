name: release-web

on:
  workflow_run:
    workflows:
      - daily-build
    types:
      - completed
  workflow_dispatch:
  workflow_call:
    inputs:
      build_number:
        type: string
        required: true
      build_bundle_version:
        type: string
        required: true
      build_source:
        type: string
        required: false
        default: 'daily-build'
      branch:
        type: string
        required: false
      commit:
        type: string
        required: false
      checkout_ref:
        type: string
        required: false
      skip_pages_deploy:
        type: boolean
        required: false
        default: false
      test_endpoint:
        type: string
        required: false
        default: ''
    secrets:
      PRIVATE_FONTS_TOKEN:
        required: false
      PRIVATE_FONTS_ARTIFACT_KEY:
        required: false
      COVALENT_KEY:
        required: false
      SENTRY_TOKEN:
        required: false
      SENTRY_DSN_REACT_NATIVE:
        required: false
      SENTRY_DSN_WEB:
        required: false
      SENTRY_DSN_DESKTOP:
        required: false
      SENTRY_DSN_MAS:
        required: false
      SENTRY_DSN_SNAP:
        required: false
      SENTRY_DSN_WINMS:
        required: false
      SENTRY_DSN_EXT:
        required: false
      SLACK_NOTIFICATION_WEBHOOK:
        required: false
      ACTION_SIGN_SECERT_KEY:
        required: false

env:
  # Release artifacts must ship the licensed brand font; fonts-sync fails
  # instead of falling back to the open-source face.
  ONEKEY_REQUIRE_PRIVATE_FONTS: '1'
  NODE_ENV: production
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  # Fetches the licensed brand font without running repository code; build
  # jobs below restore it from an encrypted artifact.
  private-fonts:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/private-fonts.yml
    secrets:
      PRIVATE_FONTS_TOKEN: ${{ secrets.PRIVATE_FONTS_TOKEN }}
      PRIVATE_FONTS_ARTIFACT_KEY: ${{ secrets.PRIVATE_FONTS_ARTIFACT_KEY }}

  test-web:
    needs: private-fonts
    runs-on: ubuntu-24.04
    env:
      TEST_ENDPOINT: ${{ inputs.test_endpoint || 'app.onekeytest.com' }}

    if: ${{ !github.event.workflow_run || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Show executed time
        run: |
          echo "Executed at: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Validate workflow_run source
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.head_repository.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Rejecting workflow_run from fork repository"
            exit 1
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ inputs.checkout_ref || '' }}

      # Restore the private brand font fetched by the trusted `private-fonts` job
      # (no App key here; the artifact key only decrypts fonts). fonts:sync
# verifies the result against this checkout's brand.lock.json.
      - name: Restore private fonts
        if: needs.private-fonts.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.private-fonts.outputs.artifact }}
          path: ${{ runner.temp }}/private-fonts-artifact

      - name: Decrypt private fonts
        if: needs.private-fonts.outputs.artifact != ''
        shell: bash
        env:
          FONTS_KEY: ${{ secrets.PRIVATE_FONTS_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/onekey-private-fonts"
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const [input, dir] = process.argv.slice(1);
            const blob = fs.readFileSync(input);
            const decipher = crypto.createDecipheriv('aes-256-gcm', Buffer.from(process.env.FONTS_KEY, 'hex'), blob.subarray(0, 12));
            decipher.setAuthTag(blob.subarray(12, 28));
            const bundle = JSON.parse(Buffer.concat([decipher.update(blob.subarray(28)), decipher.final()]).toString());
            fs.rmSync(dir, { recursive: true, force: true });
            fs.mkdirSync(dir, { recursive: true });
            for (const [name, data] of Object.entries(bundle)) {
              if (!/^[a-z]+\.ttf$/.test(name)) throw new Error('unexpected font entry ' + name);
              fs.writeFileSync(path.join(dir, name), Buffer.from(data, 'base64'));
            }
          " "${RUNNER_TEMP}/private-fonts-artifact/private-fonts.enc" "$dir"
          rm -rf "${RUNNER_TEMP}/private-fonts-artifact"
          echo "ONEKEY_PRIVATE_FONTS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          checkout_ref: ${{ inputs.checkout_ref || '' }}
          env_file_name: '.env'
          sentry_project: 'web'
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}
          sentry_dsn_react_native: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
          sentry_dsn_web: ${{ secrets.SENTRY_DSN_WEB }}
          sentry_dsn_desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry_dsn_mas: ${{ secrets.SENTRY_DSN_MAS }}
          sentry_dsn_snap: ${{ secrets.SENTRY_DSN_SNAP }}
          sentry_dsn_winms: ${{ secrets.SENTRY_DSN_WINMS }}
          sentry_dsn_ext: ${{ secrets.SENTRY_DSN_EXT }}

      - name: Setup Environment
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'
          node-version: '24.x'
          package-manager-cache: false

      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: |
          node <<'NODE'
          // Match the repository's Yarn 4 cache path without executing checkout plugins.
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const base = process.platform === 'win32'
            ? path.join(process.env.LOCALAPPDATA || path.join(os.homedir(), 'AppData', 'Local'), 'Yarn', 'Berry')
            : process.env.XDG_DATA_HOME
              ? path.join(process.env.XDG_DATA_HOME, 'yarn', 'berry')
              : path.join(os.homedir(), '.yarn', 'berry');
          const cache = process.env.YARN_ENABLE_GLOBAL_CACHE === 'true'
            ? path.join(base, 'cache') : path.join(process.env.GITHUB_WORKSPACE, '.yarn', 'cache');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${cache}\narch=${process.arch}\n`);
          NODE

      - name: Restore Yarn cache from x
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-

      - name: Setup ENV
        run: |
          pkg_version=$(node -p "require('./apps/web/package.json').version")
          echo "pkg_version=$pkg_version"
          printf 'PKG_VERSION=%s\n' "$pkg_version" >> "$GITHUB_ENV"

          # For test environment, use GitHub Pages URL
          echo "PUBLIC_URL=https://${{ env.TEST_ENDPOINT }}/" >> $GITHUB_ENV

      - name: Override params from caller
        if: ${{ inputs.build_number }}
        run: |
          echo "BUILD_NUMBER=${{ inputs.build_number }}" >> $GITHUB_ENV
          echo "BUILD_BUNDLE_VERSION=${{ inputs.build_bundle_version }}" >> $GITHUB_ENV
          sed -i "s/^BUNDLE_VERSION=.*/BUNDLE_VERSION=${{ inputs.build_bundle_version }}/" .env
          sed -i "s/^CI_BUILD_NUMBER=.*/CI_BUILD_NUMBER=${{ inputs.build_number }}/" .env

      - name: Resolve branch and commit
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_COMMIT: ${{ inputs.commit }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_BRANCH" ]; then
            BRANCH="$INPUT_BRANCH"
            COMMIT="$INPUT_COMMIT"
          elif [ -n "$WR_COMMIT" ]; then
            BRANCH="$WR_BRANCH"
            COMMIT="$WR_COMMIT"
          else
            BRANCH="${{ github.ref_name }}"
            COMMIT="${{ github.sha }}"
          fi
          # Validate commit SHA format to prevent env injection
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Invalid commit SHA format: $COMMIT"
            exit 1
          fi
          DELIMITER=$(uuidgen)
          {
            echo "BRANCH<<${DELIMITER}"
            echo "$BRANCH"
            echo "${DELIMITER}"
          } >> "$GITHUB_ENV"
          {
            echo "COMMIT<<${DELIMITER}"
            echo "$COMMIT"
            echo "${DELIMITER}"
          } >> "$GITHUB_ENV"
          COMMIT_MESSAGE=$(git log -1 --pretty=%s "$COMMIT" 2>/dev/null || echo "")
          {
            echo "COMMIT_MESSAGE<<${DELIMITER}"
            echo "$COMMIT_MESSAGE"
            echo "${DELIMITER}"
          } >> "$GITHUB_ENV"
          # Override commit SHA for the build. GITHUB_SHA is a built-in GitHub Actions
          # env var that cannot be reliably overridden via $GITHUB_ENV. Instead, set
          # WORKFLOW_GITHUB_SHA which takes priority in platformEnv.githubSHA.
          sed -i "s/^GITHUB_SHA=.*/GITHUB_SHA=$COMMIT/" .env
          echo "GITHUB_SHA=$COMMIT" >> $GITHUB_ENV
          echo "WORKFLOW_GITHUB_SHA=$COMMIT" >> $GITHUB_ENV
          echo "WORKFLOW_GITHUB_SHA=$COMMIT" >> .env
          # Override PUBLIC_URL with resolved commit for bundle releases (like production)
          if [ -n "${{ inputs.build_number }}" ]; then
            echo "PUBLIC_URL=https://${TEST_ENDPOINT}/${COMMIT}-${{ env.BUILD_NUMBER }}/" >> "$GITHUB_ENV"
          fi

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dependency
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        uses: ./.github/actions/install-dependencies

      - name: Build Target
        env:
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          MARKET_HOME_TOKEN_SEED_ENV: 'test'
          MARKET_HOME_TOKEN_SEED_REQUIRED: '1'
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: |
          yarn app:web:build

      - name: Verify Service Worker Bundle
        run: node apps/web/scripts/validate-built-service-worker.mjs

      - name: Verify Market Bootstrap Data
        run: |
          grep -q "__ONEKEY_BOOTSTRAP_DATA__" apps/web/web-build/index.html
          grep -q "__ONEKEY_BOOTSTRAP_DATA__" apps/web/web-build/404.html

      # rspack (unlike the old webpack build) has no in-build Sentry plugin, so
      # sourcemaps are uploaded here via sentry-cli and then deleted from the
      # shipped artifact. Mirrors the webpack sentryWebpackPlugin behaviour
      # (upload + filesToDeleteAfterUpload). Guarded: skips upload if no token.
      - name: Upload Web Sourcemaps to Sentry
        id: upload_web_sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: onekey-bb
          SENTRY_PROJECT: web
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No SENTRY_AUTH_TOKEN — skipping sourcemap upload."
            # Signal the cleanup step that no upload happened, so it KEEPS the
            # .map files in the artifact as an offline symbolication fallback.
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RELEASE="${{ env.BUILD_APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          npx sentry-cli releases new "$RELEASE" || true
          # IMPORTANT: do NOT run `sourcemaps inject` here. inject rewrites the
          # built .js files in place (prepends a _sentryDebugIds IIFE + appends
          # //# debugId), which would invalidate the sha384 Subresource
          # Integrity hashes rspack already baked into index.html at build time.
          # Served cross-origin (app-assets.onekey.so) with crossorigin=anonymous
          # the browser would hard-block every script -> blank app. Use
          # release-based upload (no source-file mutation) so SRI stays valid.
          # Derive the artifact url-prefix from PUBLIC_URL so it matches how the
          # assets are ACTUALLY served. With no debug-ids, Sentry associates maps
          # purely by release + path: it strips the host from the event abs_path
          # and prepends `~`, so the uploaded prefix MUST carry the same path
          # segment. PUBLIC_URL is `https://<host>/[<commit>-<build>/]`; keep its
          # path (with trailing slash) after `~`. A bare `~/` (no path) was the
          # old value and stays correct when PUBLIC_URL has no path segment.
          # Without this the maps upload as `~/static/js/*.js` while events report
          # `~/<commit>-<build>/static/js/*.js` -> orphaned maps, minified stacks.
          URL_PREFIX="~$(printf '%s' "$PUBLIC_URL" | sed -E 's#^https?://[^/]+##')"
          npx sentry-cli sourcemaps upload --release "$RELEASE" --url-prefix "$URL_PREFIX" ./apps/web/web-build
          npx sentry-cli releases finalize "$RELEASE" || true
          # Upload succeeded (set -e would have aborted before here otherwise):
          # authorize the cleanup step to strip the now-redundant .map files.
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Cleanup Web Sourcemaps and License Files
        if: always()
        run: |
          # LICENSE banner files are never shipped, regardless of sourcemaps.
          find ./apps/web/web-build -name '*.LICENSE.txt' -type f -delete
          # Only strip .map files once they were actually uploaded to Sentry.
          # If the upload was skipped (no SENTRY_AUTH_TOKEN) or failed, KEEP the
          # maps in the artifact so the release stays symbolicable offline,
          # instead of shipping maps that are neither uploaded nor retained
          # (-> minified-only stacks for that release).
          if [ "${{ steps.upload_web_sourcemaps.outputs.uploaded }}" = "true" ]; then
            find ./apps/web/web-build \
              \( -name '*.js.map' -o -name '*.css.map' \) \
              -type f -delete
          else
            echo "Sourcemap upload skipped/failed — keeping .map files in artifact as fallback."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-monorepo-test-${{ env.COMMIT }}-${{ env.BUILD_NUMBER }}
          path: |
            ./apps/web/web-build/

      - name: Deploy Github Pages
        if: ${{ !inputs.skip_pages_deploy }}
        uses: OneKeyHQ/actions/gh-pages@86ad045e18da7958f659995ee2f9df375dd03ef4 # pin to SHA
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/web-build
          cname: ${{ env.TEST_ENDPOINT }}
          force_orphan: true

      - name: Unmount dependency image
        if: always() && steps.dependencies.outcome != 'skipped'
        run: python3 .github/scripts/ci-dependencies.py cleanup

  build-production:
    needs: private-fonts
    runs-on: ubuntu-24.04

    if: ${{ !github.event.workflow_run || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Validate workflow_run source
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.head_repository.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Rejecting workflow_run from fork repository"
            exit 1
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ inputs.checkout_ref || '' }}

      # Restore the private brand font fetched by the trusted `private-fonts` job
      # (no App key here; the artifact key only decrypts fonts). fonts:sync
# verifies the result against this checkout's brand.lock.json.
      - name: Restore private fonts
        if: needs.private-fonts.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.private-fonts.outputs.artifact }}
          path: ${{ runner.temp }}/private-fonts-artifact

      - name: Decrypt private fonts
        if: needs.private-fonts.outputs.artifact != ''
        shell: bash
        env:
          FONTS_KEY: ${{ secrets.PRIVATE_FONTS_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/onekey-private-fonts"
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const [input, dir] = process.argv.slice(1);
            const blob = fs.readFileSync(input);
            const decipher = crypto.createDecipheriv('aes-256-gcm', Buffer.from(process.env.FONTS_KEY, 'hex'), blob.subarray(0, 12));
            decipher.setAuthTag(blob.subarray(12, 28));
            const bundle = JSON.parse(Buffer.concat([decipher.update(blob.subarray(28)), decipher.final()]).toString());
            fs.rmSync(dir, { recursive: true, force: true });
            fs.mkdirSync(dir, { recursive: true });
            for (const [name, data] of Object.entries(bundle)) {
              if (!/^[a-z]+\.ttf$/.test(name)) throw new Error('unexpected font entry ' + name);
              fs.writeFileSync(path.join(dir, name), Buffer.from(data, 'base64'));
            }
          " "${RUNNER_TEMP}/private-fonts-artifact/private-fonts.enc" "$dir"
          rm -rf "${RUNNER_TEMP}/private-fonts-artifact"
          echo "ONEKEY_PRIVATE_FONTS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
