name: release-android

on:
  workflow_run:
    workflows:
      - daily-build
      - daily-build-dev
    types:
      - completed
  workflow_dispatch:
    inputs:
      ONEKEY_ALLOW_SKIP_GPG_VERIFICATION:
        description: "Allow skipping GPG verification for bundle updates (default: false)"
        required: false
        type: boolean
        default: false
      ENABLE_STARTUP_PROFILE:
        description: "Build with ONEKEY_STARTUP_PROFILE=1 (uses the -startup-profile variant of the selected EAS profile). See skill 1k-startup-profile."
        required: false
        type: boolean
        default: false
      ENABLE_FUNCTION_TRACE:
        description: "Build with per-function tracing (ONEKEY_FUNCTION_TRACE=1; implies startup profile; large bundle and log output). Uses the -function-trace variant of the selected EAS profile."
        required: false
        type: boolean
        default: false

env:
  NODE_ENV: production
  YARN_ENABLE_GLOBAL_CACHE: true
  ONEKEY_ALLOW_SKIP_GPG_VERIFICATION: ${{ github.event.inputs.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION || 'false' }}
  ENABLE_STARTUP_PROFILE: ${{ github.event.inputs.ENABLE_STARTUP_PROFILE || 'false' }}
  ENABLE_FUNCTION_TRACE: ${{ github.event.inputs.ENABLE_FUNCTION_TRACE || 'false' }}

jobs:
  release-android:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.workflow_run || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Show executed time
        run: |
          echo "Executed at: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          additional_env: |
            NO_FLIPPER=1
            SENTRY_DISABLE_AUTO_UPLOAD=false
          env_file_name: '.env.expo'
          sentry_project: ''
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}
          sentry_dsn_react_native: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
          sentry_dsn_web: ${{ secrets.SENTRY_DSN_WEB }}
          sentry_dsn_desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry_dsn_mas: ${{ secrets.SENTRY_DSN_MAS }}
          sentry_dsn_snap: ${{ secrets.SENTRY_DSN_SNAP }}
          sentry_dsn_winms: ${{ secrets.SENTRY_DSN_WINMS }}
          sentry_dsn_ext: ${{ secrets.SENTRY_DSN_EXT }}

      - name: Warn if GPG verification is skipped
        if: ${{ env.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION == 'true' }}
        run: |
          echo "::warning::GPG verification is SKIPPED for this build. This should only be used in CI/dev builds."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
          scope: '@onekeyhq'

      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: |
          node <<'NODE'
          // Match the repository's Yarn 4 cache path without executing checkout plugins.
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const base = process.platform === 'win32'
            ? path.join(process.env.LOCALAPPDATA || path.join(os.homedir(), 'AppData', 'Local'), 'Yarn', 'Berry')
            : process.env.XDG_DATA_HOME
              ? path.join(process.env.XDG_DATA_HOME, 'yarn', 'berry')
              : path.join(os.homedir(), '.yarn', 'berry');
          const cache = process.env.YARN_ENABLE_GLOBAL_CACHE === 'true'
            ? path.join(base, 'cache') : path.join(process.env.GITHUB_WORKSPACE, '.yarn', 'cache');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${cache}\narch=${process.arch}\n`);
          NODE

      - name: Restore Yarn cache from x
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-

      - name: Setup keys secret
        run: |
          rm -rf apps/mobile/android/app/google-services.json
          echo ${{ secrets.GOOGLE_SERVICE_ANDROID }} | base64 -d > apps/mobile/android/app/google-services.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Modify build.gradle
        uses: OneKeyHQ/actions/build-gradle-edit@86ad045e18da7958f659995ee2f9df375dd03ef4 # pin to SHA
        with:
          versionCode: ${{ env.BUILD_NUMBER }}
          versionName: ${{ env.BUILD_APP_VERSION }}
          packageName: 'so.onekey.app.wallet'
          android_dir: ./apps/mobile

      - name: Write .env.version
        run: |
          # pass BUILD_NUMBER as env variable to expo server
          echo "BUILD_NUMBER=${{ env.BUILD_NUMBER }}" >> .env.version

      - name: Write .sentry.properties
        run: |
          echo "auth.token=${{ secrets.SENTRY_TOKEN }}" >> apps/mobile/android/sentry.properties

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dep
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: |
          yarn install --immutable

      - name: Build on EAS And Submit
        if: ${{ github.event.workflow_run }}
        run: |
          cd apps/mobile

          if [[ "${ONEKEY_ALLOW_SKIP_GPG_VERIFICATION}" == "true" ]]; then
            INTERNAL_PROFILE="qa-internal"
            STORE_PROFILE="qa-internal-store"
          else
            INTERNAL_PROFILE="production"
            STORE_PROFILE="production-store"
          fi

          # Profiling builds use the matching -function-trace/-startup-profile
          # variant, keeping the signing, GPG setting and Google Play submit of
          # the normal build. See skill 1k-startup-profile.
          if [[ "${ENABLE_FUNCTION_TRACE}" == "true" ]]; then
            INTERNAL_PROFILE="${INTERNAL_PROFILE}-function-trace"
            STORE_PROFILE="${STORE_PROFILE}-function-trace"
          elif [[ "${ENABLE_STARTUP_PROFILE}" == "true" ]]; then
            INTERNAL_PROFILE="${INTERNAL_PROFILE}-startup-profile"
            STORE_PROFILE="${STORE_PROFILE}-startup-profile"
          fi

          # if env.WORKFLOW_BUILD_NUMBER exists and start with 1000, it's a dev build
          if [[ -n "${{ env.WORKFLOW_BUILD_NUMBER }}" && "${{ env.WORKFLOW_BUILD_NUMBER }}" == 1000* ]]; then
            eas build --profile="${INTERNAL_PROFILE}" --platform android --non-interactive --no-wait --resource-class large
          else
            eas build --profile="${INTERNAL_PROFILE}" --platform android --non-interactive --no-wait --resource-class large
            eas build --profile="${STORE_PROFILE}" --platform android --non-interactive --no-wait --resource-class large --auto-submit
          fi

      - name: Build on EAS
        if: ${{ !github.event.workflow_run }}
        run: |
          cd apps/mobile
          if [[ "${ONEKEY_ALLOW_SKIP_GPG_VERIFICATION}" == "true" ]]; then
            PROFILE="qa-internal"
          else
            PROFILE="production"
          fi
          # Profiling builds use the matching -function-trace/-startup-profile
          # variant of the same profile. See skill 1k-startup-profile.
          if [[ "${ENABLE_FUNCTION_TRACE}" == "true" ]]; then
            PROFILE="${PROFILE}-function-trace"
          elif [[ "${ENABLE_STARTUP_PROFILE}" == "true" ]]; then
            PROFILE="${PROFILE}-startup-profile"
          fi
          eas build --profile="${PROFILE}" --platform android --non-interactive --no-wait --resource-class large
