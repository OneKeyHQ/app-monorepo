name: release-android

on:
  workflow_run:
    workflows:
      - daily-build
      - daily-build-dev
    types:
      - completed
  workflow_dispatch:
    inputs:
      ONEKEY_ALLOW_SKIP_GPG_VERIFICATION:
        description: "Allow skipping GPG verification for bundle updates (default: false)"
        required: false
        type: boolean
        default: false
      ENABLE_STARTUP_PROFILE:
        description: "Build with ONEKEY_STARTUP_PROFILE=1 (forces qa-internal-startup-profile, no store submit). See skill 1k-startup-profile."
        required: false
        type: boolean
        default: false

env:
  # Release artifacts must ship the licensed brand font; fonts-sync fails
  # instead of falling back to the open-source face.
  ONEKEY_REQUIRE_PRIVATE_FONTS: '1'
  NODE_ENV: production
  YARN_ENABLE_GLOBAL_CACHE: true
  ONEKEY_ALLOW_SKIP_GPG_VERIFICATION: ${{ github.event.inputs.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION || 'false' }}
  ENABLE_STARTUP_PROFILE: ${{ github.event.inputs.ENABLE_STARTUP_PROFILE || 'false' }}

jobs:
  # Fetches the licensed brand font without running repository code; build
  # jobs below restore it from an encrypted artifact.
  private-fonts:
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/private-fonts.yml
    secrets:
      PRIVATE_FONTS_TOKEN: ${{ secrets.PRIVATE_FONTS_TOKEN }}
      PRIVATE_FONTS_ARTIFACT_KEY: ${{ secrets.PRIVATE_FONTS_ARTIFACT_KEY }}

  release-android:
    needs: private-fonts
    runs-on: ubuntu-24.04
    if: ${{ !github.event.workflow_run || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Show executed time
        run: |
          echo "Executed at: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      # Restore the private brand font fetched by the trusted `private-fonts` job
      # (no App key here; the artifact key only decrypts fonts). fonts:sync
# verifies the result against this checkout's brand.lock.json.
      - name: Restore private fonts
        if: needs.private-fonts.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.private-fonts.outputs.artifact }}
          path: ${{ runner.temp }}/private-fonts-artifact

      - name: Decrypt private fonts
        if: needs.private-fonts.outputs.artifact != ''
        shell: bash
        env:
          FONTS_KEY: ${{ secrets.PRIVATE_FONTS_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/onekey-private-fonts"
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const [input, dir] = process.argv.slice(1);
            const blob = fs.readFileSync(input);
            const decipher = crypto.createDecipheriv('aes-256-gcm', Buffer.from(process.env.FONTS_KEY, 'hex'), blob.subarray(0, 12));
            decipher.setAuthTag(blob.subarray(12, 28));
            const bundle = JSON.parse(Buffer.concat([decipher.update(blob.subarray(28)), decipher.final()]).toString());
            fs.rmSync(dir, { recursive: true, force: true });
            fs.mkdirSync(dir, { recursive: true });
            for (const [name, data] of Object.entries(bundle)) {
              if (!/^[a-z]+\.ttf$/.test(name)) throw new Error('unexpected font entry ' + name);
              fs.writeFileSync(path.join(dir, name), Buffer.from(data, 'base64'));
            }
          " "${RUNNER_TEMP}/private-fonts-artifact/private-fonts.enc" "$dir"
          rm -rf "${RUNNER_TEMP}/private-fonts-artifact"
          echo "ONEKEY_PRIVATE_FONTS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          additional_env: |
            NO_FLIPPER=1
            SENTRY_DISABLE_AUTO_UPLOAD=false
          env_file_name: '.env.expo'
          sentry_project: ''
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}
          sentry_dsn_react_native: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
          sentry_dsn_web: ${{ secrets.SENTRY_DSN_WEB }}
          sentry_dsn_desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry_dsn_mas: ${{ secrets.SENTRY_DSN_MAS }}
          sentry_dsn_snap: ${{ secrets.SENTRY_DSN_SNAP }}
          sentry_dsn_winms: ${{ secrets.SENTRY_DSN_WINMS }}
          sentry_dsn_ext: ${{ secrets.SENTRY_DSN_EXT }}

      - name: Warn if GPG verification is skipped
        if: ${{ env.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION == 'true' }}
        run: |
          echo "::warning::GPG verification is SKIPPED for this build. This should only be used in CI/dev builds."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
          scope: '@onekeyhq'

      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: |
          node <<'NODE'
          // Match the repository's Yarn 4 cache path without executing checkout plugins.
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const base = process.platform === 'win32'
            ? path.join(process.env.LOCALAPPDATA || path.join(os.homedir(), 'AppData', 'Local'), 'Yarn', 'Berry')
            : process.env.XDG_DATA_HOME
              ? path.join(process.env.XDG_DATA_HOME, 'yarn', 'berry')
              : path.join(os.homedir(), '.yarn', 'berry');
          const cache = process.env.YARN_ENABLE_GLOBAL_CACHE === 'true'
            ? path.join(base, 'cache') : path.join(process.env.GITHUB_WORKSPACE, '.yarn', 'cache');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${cache}\narch=${process.arch}\n`);
          NODE

      - name: Restore Yarn cache from x
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-

      - name: Setup keys secret
        run: |
          rm -rf apps/mobile/android/app/google-services.json
          echo ${{ secrets.GOOGLE_SERVICE_ANDROID }} | base64 -d > apps/mobile/android/app/google-services.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Modify build.gradle
        uses: OneKeyHQ/actions/build-gradle-edit@86ad045e18da7958f659995ee2f9df375dd03ef4 # pin to SHA
        with:
          versionCode: ${{ env.BUILD_NUMBER }}
          versionName: ${{ env.BUILD_APP_VERSION }}
          packageName: 'so.onekey.app.wallet'
          android_dir: ./apps/mobile

      - name: Write .env.version
        run: |
          # pass BUILD_NUMBER as env variable to expo server
          echo "BUILD_NUMBER=${{ env.BUILD_NUMBER }}" >> .env.version

      - name: Write .sentry.properties
        run: |
          echo "auth.token=${{ secrets.SENTRY_TOKEN }}" >> apps/mobile/android/sentry.properties

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Install Dep
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=8192'
        uses: ./.github/actions/install-dependencies

      # EAS skips gitignored files, so hand it the verified private font through
      # a non-ignored directory. fonts:sync on the EAS install picks it up before
      # iOS pod install; eas-build-post-install verifies the native copies.
      - name: Stage private fonts for EAS
        run: node development/scripts/fonts-sync.js --stage-eas

      - name: Build on EAS And Submit
        if: ${{ github.event.workflow_run }}
        run: |
          cd apps/mobile

          if [[ "${ONEKEY_ALLOW_SKIP_GPG_VERIFICATION}" == "true" ]]; then
            INTERNAL_PROFILE="qa-internal"
            STORE_PROFILE="qa-internal-store"
          else
            INTERNAL_PROFILE="production"
            STORE_PROFILE="production-store"
          fi

          # if env.WORKFLOW_BUILD_NUMBER exists and start with 1000, it's a dev build
          if [[ -n "${{ env.WORKFLOW_BUILD_NUMBER }}" && "${{ env.WORKFLOW_BUILD_NUMBER }}" == 1000* ]]; then
            eas build --profile="${INTERNAL_PROFILE}" --platform android --non-interactive --no-wait --resource-class large
          else
            eas build --profile="${INTERNAL_PROFILE}" --platform android --non-interactive --no-wait --resource-class large
            eas build --profile="${STORE_PROFILE}" --platform android --non-interactive --no-wait --resource-class large --auto-submit
          fi

      - name: Build on EAS
        if: ${{ !github.event.workflow_run }}
        run: |
          cd apps/mobile
          if [[ "${ENABLE_STARTUP_PROFILE}" == "true" ]]; then
            # Profiling build: forces qa-internal-startup-profile (internal APK
            # only, never store-submits). See skill 1k-startup-profile.
            PROFILE="qa-internal-startup-profile"
          elif [[ "${ONEKEY_ALLOW_SKIP_GPG_VERIFICATION}" == "true" ]]; then
            PROFILE="qa-internal"
          else
            PROFILE="production"
          fi
          eas build --profile="${PROFILE}" --platform android --non-interactive --no-wait --resource-class large

      - name: Unmount dependency image
        if: always() && steps.dependencies.outcome != 'skipped'
        run: python3 .github/scripts/ci-dependencies.py cleanup
