name: 05-security-checks

on:
  pull_request:
    branches:
      - onekey
      - x
      - hotfix/*
      - release/*
  push:
    branches:
      - onekey
      - x

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  supply-chain:
    name: Release Age
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          fetch-depth: 1

      - name: Use Node.js 24.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          package-manager-cache: false
          check-latest: true

      - name: Write security checks AI prompt
        run: |
          mkdir -p ci-ai
          node .github/scripts/ciFailureIssue.js prompt security-checks > ci-ai/security-checks-ai-prompt.md || \
            echo "AI prompt generation failed; inspect the failed step log and minimum-release-age.log." > ci-ai/security-checks-ai-prompt.md

      - name: Check minimum release age
        run: |
          mkdir -p ci-ai
          set +e
          (
            # Read the first parent even when HEAD was checked out shallowly.
            base_sha=$(git cat-file commit HEAD | sed -n '2s/^parent //p')
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not read the PR merge commit's base SHA."
              exit 1
            fi

            for attempt in 1 2 3; do
              if git fetch --no-tags --depth=1 origin "$base_sha"; then
                exec node development/scripts/minimum-release-age/run.ts diff "$base_sha"
              else
                fetch_status=$?
              fi

              if (( attempt < 3 )); then
                delay=$((attempt * 10))
                printf 'Base fetch attempt %d/3 failed with exit code %d. Retrying in %d seconds.\n' "$attempt" "$fetch_status" "$delay"
                sleep "$delay"
              fi
            done
            exit "$fetch_status"
          ) 2>&1 | tee ci-ai/minimum-release-age.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload security checks AI diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-ai-security-checks-diagnostics
          path: |
            ci-ai/security-checks-ai-prompt.md
            ci-ai/minimum-release-age.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain security check failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-security-checks-diagnostics\`"
            echo "- Open: \`minimum-release-age.log\` and \`security-checks-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-security-checks-diagnostics and inspect minimum-release-age.log"
