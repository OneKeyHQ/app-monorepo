name: 05-security-checks

on:
  pull_request:
    branches:
      - onekey
      - x
      - hotfix/*
      - release/*
  push:
    branches:
      - onekey
      - x

# Cancel a currently running workflow from the same PR/branch/tag
# when a new workflow is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  supply-chain:
    name: Release Age
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false
          check-latest: true
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: |
          node <<'NODE'
          // Match the repository's Yarn 4 cache path without executing checkout plugins.
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const base = process.platform === 'win32'
            ? path.join(process.env.LOCALAPPDATA || path.join(os.homedir(), 'AppData', 'Local'), 'Yarn', 'Berry')
            : process.env.XDG_DATA_HOME
              ? path.join(process.env.XDG_DATA_HOME, 'yarn', 'berry')
              : path.join(os.homedir(), '.yarn', 'berry');
          const cache = process.env.YARN_ENABLE_GLOBAL_CACHE === 'true'
            ? path.join(base, 'cache') : path.join(process.env.GITHUB_WORKSPACE, '.yarn', 'cache');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${cache}\narch=${process.arch}\n`);
          NODE

      - name: Restore Yarn cache from x
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.yarn-cache.outputs.arch }}-yarn-

      - name: Write security checks AI prompt
        run: |
          mkdir -p ci-ai
          node .github/scripts/ciFailureIssue.js prompt security-checks > ci-ai/security-checks-ai-prompt.md || \
            echo "AI prompt generation failed; inspect the failed step log and minimum-release-age.log." > ci-ai/security-checks-ai-prompt.md

      - name: Install Dependency
        id: dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        uses: ./.github/actions/install-dependencies

      - name: Check minimum release age
        run: |
          mkdir -p ci-ai
          set +e
          npx tsx development/scripts/minimum-release-age/run.ts diff origin/${{ github.base_ref }} 2>&1 | tee ci-ai/minimum-release-age.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload security checks AI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ai-security-checks-diagnostics
          path: |
            ci-ai/security-checks-ai-prompt.md
            ci-ai/minimum-release-age.log
          if-no-files-found: warn
          retention-days: 14

      - name: Explain security check failure diagnostics
        if: failure()
        run: |
          {
            echo "### CI diagnostics"
            echo "- Download artifact: \`ci-ai-security-checks-diagnostics\`"
            echo "- Open: \`minimum-release-age.log\` and \`security-checks-ai-prompt.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=CI diagnostics::Download ci-ai-security-checks-diagnostics and inspect minimum-release-age.log"

      - name: Unmount dependency image
        if: always() && steps.dependencies.outcome != 'skipped'
        run: python3 .github/scripts/ci-dependencies.py cleanup
