name: Mobile Dev Shell iOS Simulator

on:
  workflow_dispatch:
    inputs:
      ONEKEY_ALLOW_SKIP_GPG_VERIFICATION:
        description: "Allow skipping GPG verification for bundle updates (default: false)"
        required: false
        type: boolean
        default: false

env:
  NODE_ENV: production
  YARN_ENABLE_GLOBAL_CACHE: true
  ONEKEY_ALLOW_SKIP_GPG_VERIFICATION: ${{ github.event.inputs.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION || 'false' }}

jobs:
  build-ios-simulator-dev-shell:
    name: Build iOS Simulator arm64 dev shell
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: macos-26
    strategy:
      matrix:
        node-version: [24.x]
        ruby-version: [3.4.4]
        xcode-version: [26.0]

    steps:
      - name: Show executed time
        run: |
          echo "Executed at: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Shared Env Setup
        uses: ./.github/actions/shared-env
        with:
          env_file_name: '.env.expo'
          sentry_project: ''
          covalent_key: ${{ secrets.COVALENT_KEY }}
          sentry_token: ${{ secrets.SENTRY_TOKEN }}
          sentry_dsn_react_native: ${{ secrets.SENTRY_DSN_REACT_NATIVE }}
          sentry_dsn_web: ${{ secrets.SENTRY_DSN_WEB }}
          sentry_dsn_desktop: ${{ secrets.SENTRY_DSN_DESKTOP }}
          sentry_dsn_mas: ${{ secrets.SENTRY_DSN_MAS }}
          sentry_dsn_snap: ${{ secrets.SENTRY_DSN_SNAP }}
          sentry_dsn_winms: ${{ secrets.SENTRY_DSN_WINMS }}
          sentry_dsn_ext: ${{ secrets.SENTRY_DSN_EXT }}

      - name: Warn if GPG verification is skipped
        if: ${{ env.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION == 'true' }}
        run: |
          echo "::warning::GPG verification is SKIPPED for this build. This should only be used in CI/dev builds."

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=${{ github.workspace }}/.yarn" >> "$GITHUB_OUTPUT"

      - name: Show SDKs
        run: |
          xcodebuild -showsdks

      - name: Install Dep
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: |
          yarn install --immutable

      - name: Configure Git to use HTTPS instead of SSH
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Install Pods
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: |
          cd apps/mobile/ios
          gem install cocoapods -v 1.16.2
          pod install --deployment

      - name: Restore web-embed prebundle
        uses: ./.github/actions/restore-web-embed

      - name: Build arm64 Simulator app
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
        run: |
          node apps/mobile/scripts/build-mobile-dev-shell.js build \
            --platform ios \
            --skip-pods

      - name: Create arm64 Simulator app manifest
        id: artifact
        run: |
          set -euo pipefail
          shell_artifact_key="$(node apps/mobile/scripts/native-dev-shell.js artifact-manifest \
            --platform ios \
            --artifact apps/mobile/out-dir-bundle/dev-shell/OneKeyWallet-DevShell-ios-simulator-arm64.zip \
            --web-embed-receipt apps/web-embed/out-dir-bundle/web-embed-prebundle-restored.json \
            --output apps/mobile/out-dir-bundle/dev-shell/OneKeyWallet-DevShell-ios-simulator-arm64.json)"
          manifest="apps/mobile/out-dir-bundle/dev-shell/OneKeyWallet-DevShell-ios-simulator-arm64.json"
          shell_compatibility_key="$(jq -er '.shellCompatibilityKey' "$manifest")"
          {
            echo "artifact_tag=mobile-dev-shell-artifact-v2-ios-simulator-arm64-$shell_artifact_key"
            echo "compatibility_key=$shell_compatibility_key"
            echo "compatibility_tag=mobile-dev-shell-compat-v2-ios-simulator-arm64-$shell_compatibility_key"
          } >> "$GITHUB_OUTPUT"

      - name: Publish iOS Simulator dev shell to GHCR
        uses: ./.github/actions/publish-mobile-dev-shell
        with:
          architecture: arm64
          artifact: apps/mobile/out-dir-bundle/dev-shell/OneKeyWallet-DevShell-ios-simulator-arm64.zip
          artifact_tag: ${{ steps.artifact.outputs.artifact_tag }}
          compatibility_key: ${{ steps.artifact.outputs.compatibility_key }}
          compatibility_tag: ${{ steps.artifact.outputs.compatibility_tag }}
          manifest: apps/mobile/out-dir-bundle/dev-shell/OneKeyWallet-DevShell-ios-simulator-arm64.json
          platform: ios-simulator
          signer_workflow: OneKeyHQ/app-monorepo/.github/workflows/mobile-dev-shell-ios-simulator.yml

      - name: Upload iOS Simulator dev shell
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dev-shell-ios-simulator-arm64-${{ github.sha }}
          path: |
            apps/mobile/out-dir-bundle/dev-shell/OneKeyWallet-DevShell-ios-simulator-arm64.zip
            apps/mobile/out-dir-bundle/dev-shell/OneKeyWallet-DevShell-ios-simulator-arm64.json
            apps/mobile/out-dir-bundle/dev-shell/mobile-dev-shell-attestations.jsonl
          if-no-files-found: error
