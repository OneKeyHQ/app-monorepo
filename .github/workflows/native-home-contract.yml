name: Native Home Contract Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - x
    paths:
      - '.github/workflows/native-home-contract.yml'
      - 'apps/mobile/App.tsx'
      - 'apps/mobile/src/home/**'
      - 'apps/mobile/android/**'
      - 'packages/native-components/**'
      - 'packages/kit/src/views/Home/**'
      - 'development/scripts/test-home-container-protocol-android.sh'
      - 'development/scripts/test-home-container-protocol-ios.sh'
      - 'package.json'
      - 'yarn.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  YARN_ENABLE_GLOBAL_CACHE: true

jobs:
  ios-home-contract:
    name: iOS Home contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run Swift protocol contract
        run: development/scripts/test-home-container-protocol-ios.sh

  android-home-contract:
    name: Android Home contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@onekeyhq'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: yarn install --immutable

      - name: Compile and run Kotlin protocol contract
        run: development/scripts/test-home-container-protocol-android.sh
