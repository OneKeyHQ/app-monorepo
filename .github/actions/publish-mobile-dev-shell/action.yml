name: Publish mobile dev shell
description: Attest and publish one immutable mobile dev-shell artifact to GHCR.

inputs:
  architecture:
    description: Native artifact architecture.
    required: true
  artifact:
    description: Path to the APK or Simulator app archive.
    required: true
  artifact_tag:
    description: Immutable OCI tag derived from the exact shell artifact bytes.
    required: true
  compatibility_key:
    description: Compatibility key derivable from the source checkout.
    required: true
  compatibility_tag:
    description: First-write-wins locator tag for a compatible shell.
    required: true
  manifest:
    description: Path to the artifact sidecar manifest.
    required: true
  platform:
    description: Native artifact platform.
    required: true
  signer_workflow:
    description: Expected GitHub Actions signer workflow.
    required: true

runs:
  using: composite
  steps:
    - name: Install ORAS
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      with:
        version: 1.3.1

    - name: Generate build provenance attestations
      id: attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          ${{ inputs.artifact }}
          ${{ inputs.manifest }}

    - name: Verify generated provenance offline
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
        ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        MANIFEST: ${{ inputs.manifest }}
        SIGNER_WORKFLOW: ${{ inputs.signer_workflow }}
      run: |
        set -euo pipefail
        trusted_root="apps/mobile/bundle-registry/metro-dev-prebundle-trusted-root.jsonl"
        for asset in "$ARTIFACT" "$MANIFEST"; do
          gh attestation verify "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --custom-trusted-root "$trusted_root" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
        done
        cp "$ATTESTATION_BUNDLE" \
          "$(dirname "$ARTIFACT")/mobile-dev-shell-attestations.jsonl"

    - name: Log in to GHCR
      shell: bash
      env:
        GHCR_TOKEN: ${{ github.token }}
      run: >-
        printf '%s' "$GHCR_TOKEN" |
        oras login ghcr.io
        --username "$GITHUB_ACTOR"
        --password-stdin

    - name: Publish immutable OCI artifact
      shell: bash
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
        ARTIFACT: ${{ inputs.artifact }}
        ARTIFACT_TAG: ${{ inputs.artifact_tag }}
        COMPATIBILITY_KEY: ${{ inputs.compatibility_key }}
        COMPATIBILITY_TAG: ${{ inputs.compatibility_tag }}
        MANIFEST: ${{ inputs.manifest }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        artifact_dir="$(dirname "$ARTIFACT")"
        artifact_name="$(basename "$ARTIFACT")"
        manifest_name="$(basename "$MANIFEST")"
        attestation_name="mobile-dev-shell-attestations.jsonl"
        artifact_reference="ghcr.io/onekeyhq/mobile-dev-shell:$ARTIFACT_TAG"
        compatibility_reference="ghcr.io/onekeyhq/mobile-dev-shell:$COMPATIBILITY_TAG"
        artifact_digest="sha256:$(shasum -a 256 "$ARTIFACT" | awk '{print $1}')"
        manifest_digest="sha256:$(shasum -a 256 "$MANIFEST" | awk '{print $1}')"

        descriptor_error="$RUNNER_TEMP/mobile-dev-shell-descriptor-error.txt"
        if compatibility_manifest="$(oras manifest fetch "$compatibility_reference" 2>"$descriptor_error")"; then
          jq -e \
            --arg architecture "$ARCHITECTURE" \
            --arg compatibility_key "$COMPATIBILITY_KEY" \
            --arg platform "$PLATFORM" \
            '
              .artifactType == "application/vnd.onekey.mobile-dev-shell.v1" and
              .annotations["com.onekey.mobile.architecture"] == $architecture and
              .annotations["com.onekey.mobile.platform"] == $platform and
              .annotations["com.onekey.mobile.shell-compatibility-key"] == $compatibility_key
            ' <<< "$compatibility_manifest"
        elif grep -Eiq 'manifest unknown|not found' "$descriptor_error"; then
          if artifact_manifest="$(oras manifest fetch "$artifact_reference" 2>"$descriptor_error")"; then
            jq -e \
              --arg artifact_digest "$artifact_digest" \
              --arg artifact_name "$artifact_name" \
              --arg manifest_digest "$manifest_digest" \
              --arg manifest_name "$manifest_name" \
              '
                any(.layers[]; .annotations["org.opencontainers.image.title"] == $artifact_name and .digest == $artifact_digest) and
                any(.layers[]; .annotations["org.opencontainers.image.title"] == $manifest_name and .digest == $manifest_digest)
              ' <<< "$artifact_manifest"
          elif grep -Eiq 'manifest unknown|not found' "$descriptor_error"; then
            (
              cd "$artifact_dir"
              oras push \
                --artifact-type application/vnd.onekey.mobile-dev-shell.v1 \
                --annotation "com.onekey.mobile.architecture=$ARCHITECTURE" \
                --annotation "com.onekey.mobile.platform=$PLATFORM" \
                --annotation "com.onekey.mobile.shell-compatibility-key=$COMPATIBILITY_KEY" \
                --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
                --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                --annotation "org.opencontainers.image.version=$ARTIFACT_TAG" \
                "$artifact_reference" \
                "$artifact_name:application/vnd.onekey.mobile-dev-shell.binary.v1" \
                "$manifest_name:application/vnd.onekey.mobile-dev-shell.metadata.v1+json" \
                "$attestation_name:application/vnd.onekey.mobile-dev-shell.attestation.v1+jsonl"
            )
          else
            cat "$descriptor_error" >&2
            exit 1
          fi
          oras tag "$artifact_reference" "$COMPATIBILITY_TAG"
        else
          cat "$descriptor_error" >&2
          exit 1
        fi

        oci_digest="$(oras manifest fetch --descriptor "$compatibility_reference" | jq -er '.digest')"
        {
          echo "### $PLATFORM dev shell"
          echo "- OCI reference: \`$compatibility_reference@$oci_digest\`"
          echo "- Architecture: \`$ARCHITECTURE\`"
        } >> "$GITHUB_STEP_SUMMARY"
