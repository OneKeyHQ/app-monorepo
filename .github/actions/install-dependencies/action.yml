name: Install dependencies
description: Reuse a mounted Linux dependency snapshot while preserving immutable Yarn validation.

inputs:
  save-snapshot:
    description: Populate a missing snapshot after a successful installation.
    default: 'false'
  verify-cache:
    description: Re-fetch and verify package archives before publishing a refreshed snapshot.
    default: 'false'

outputs:
  snapshot-hit:
    description: Whether the installation successfully reused the snapshot.
    value: ${{ steps.install.outputs.snapshot-hit }}

runs:
  using: composite
  steps:
    - name: Compute dependency fingerprint
      id: fingerprint
      shell: bash
      run: python3 .github/scripts/ci-dependencies.py prepare

    - name: Restore dependency image
      id: snapshot
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: ${{ steps.fingerprint.outputs.path }}
        key: ${{ steps.fingerprint.outputs.key }}
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

    - name: Mount and validate dependencies
      id: install
      shell: bash
      env:
        DEPENDENCY_SNAPSHOT_HIT: ${{ steps.snapshot.outputs.cache-hit }}
      run: python3 .github/scripts/ci-dependencies.py install

    - name: Verify refreshed package archives
      if: inputs.verify-cache == 'true'
      shell: bash
      run: yarn install --immutable --immutable-cache --check-cache

    - name: Build missing dependency image
      id: build
      if: inputs.save-snapshot == 'true' && steps.snapshot.outputs.cache-hit != 'true'
      shell: bash
      run: python3 .github/scripts/ci-dependencies.py build

    - name: Save dependency image
      if: steps.build.outputs.built == 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: ${{ steps.fingerprint.outputs.path }}
        key: ${{ steps.fingerprint.outputs.key }}
