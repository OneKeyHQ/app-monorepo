name: Shared Environment Variables Setup
description: Setup environment variables for the project

inputs:
  checkout_ref:
    required: false
    default: ''
    description: "Deprecated: callers must checkout the desired ref before invoking this local action."
  source_ref_name:
    required: false
    default: ''
    description: "Source ref name to use for release metadata when checkout uses a temporary CI ref."
  additional_env:
    required: false
    description: "Additional environment variables to inject"
  env_file_name:
    required: false
    default: ".env"
    description: "Target environment file name"
  sentry_project:
    required: false
    default: ''
    description: "Sentry project name"
  covalent_key:
    required: true
    description: "Covalent API Key"
  sentry_token:
    required: true
    description: "Sentry Auth Token"
  sentry_dsn_ext:
    required: true
    description: "Sentry External DSN of Chrome Extension"
  sentry_dsn_desktop:
    required: true
    description: "Sentry DSN of Desktop"
  sentry_dsn_mas:
    required: true
    description: "Sentry DSN of Mac App Store"
  sentry_dsn_snap:
    required: true
    description: "Sentry DSN of Snap"
  sentry_dsn_winms:
    required: true
    description: "Sentry DSN of Microsoft Store"
  sentry_dsn_react_native:
    required: true
    description: "Sentry DSN of React Native"
  sentry_dsn_web:
    required: true
    description: "Sentry DSN of Web"

runs:
  using: "composite"
  steps:
    - name: Download workflow parameters
      if: ${{ github.event.workflow_run }}
      uses: dawidd6/action-download-artifact@268677152d06ba59fcec7a7f0b5d961b6ccd7e1e # v2.28.0
      continue-on-error: true
      with:
        workflow: daily-build-dev
        name: workflow-params
        run_id: ${{ github.event.workflow_run.id }}
        path: ${{ runner.temp }}/workflow-params

    - name: Load workflow parameters
      if: ${{ github.event.workflow_run }}
      shell: bash
      run: |
        set -euo pipefail

        PARAMS_FILE="${{ runner.temp }}/workflow-params/params.env"
        if [ ! -f "$PARAMS_FILE" ]; then
          exit 0
        fi

        while IFS='=' read -r key value || [ -n "${key:-}" ]; do
          case "$key" in
            WORKFLOW_BUILD_NUMBER|WORKFLOW_BUNDLE_VERSION)
              if [[ ! "$value" =~ ^[0-9]+$ ]]; then
                echo "::error::Invalid numeric workflow parameter: $key=$value"
                exit 1
              fi
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
              ;;
            ONEKEY_ALLOW_SKIP_GPG_VERIFICATION)
              if [[ "$value" != "true" && "$value" != "false" ]]; then
                echo "::error::Invalid boolean workflow parameter: $key=$value"
                exit 1
              fi
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
              ;;
            WORKFLOW_GITHUB_SHA|WORKFLOW_GITHUB_REF_NAME)
              echo "Ignoring checkout metadata from workflow artifact: $key"
              ;;
            '')
              ;;
            *)
              echo "::warning::Ignoring unsupported workflow parameter: $key"
              ;;
          esac
        done < "$PARAMS_FILE"

    - name: Load workflow_run metadata
      if: ${{ github.event.workflow_run }}
      shell: bash
      env:
        CURRENT_REPOSITORY: ${{ github.repository }}
        WORKFLOW_RUN_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        set -euo pipefail

        if [ "$WORKFLOW_RUN_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
          echo "::error::Rejecting workflow_run from fork repository: $WORKFLOW_RUN_REPOSITORY"
          exit 1
        fi

        if [[ ! "$WORKFLOW_RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Invalid workflow_run head SHA: $WORKFLOW_RUN_SHA"
          exit 1
        fi

        printf 'WORKFLOW_GITHUB_SHA=%s\n' "$WORKFLOW_RUN_SHA" >> "$GITHUB_ENV"

        if [ -n "$WORKFLOW_RUN_BRANCH" ]; then
          {
            echo 'WORKFLOW_GITHUB_REF_NAME<<__WORKFLOW_REF__'
            printf '%s\n' "$WORKFLOW_RUN_BRANCH"
            echo '__WORKFLOW_REF__'
          } >> "$GITHUB_ENV"
        fi

    - name: Dotenv Action
      id: dotenv
      uses: OneKeyHQ/actions/dotenv-action@a0f21d9b4be112edb5c758064a55f13e514c47df # main
      with:
        path: .env.version

    - name: Setup ENV 
      shell: bash
      env:
        SOURCE_REF_NAME: ${{ inputs.source_ref_name }}
      run: |
        # Generate app version ------- start
        app_version=${{ steps.dotenv.outputs.version }}
        echo '$app_version='$app_version
        echo "BUILD_APP_VERSION=$app_version" >> $GITHUB_ENV
        # Generate app version ------- end

        # Generate app bundle version ------- start
        # Seconds since 2026-01-01T00:00:00Z epoch
        if [ ! -z "${WORKFLOW_BUNDLE_VERSION:-}" ]; then
          app_bundle_version="$WORKFLOW_BUNDLE_VERSION"
        else
          app_bundle_version=$(( $(date -u +%s) - $(date -u -d '2026-01-01T00:00:00' +%s 2>/dev/null || date -u -j -f '%Y-%m-%dT%H:%M:%S' '2026-01-01T00:00:00' +%s) ))
        fi
        echo '$app_bundle_version='$app_bundle_version
        echo "BUILD_BUNDLE_VERSION=$app_bundle_version" >> $GITHUB_ENV
        # Generate app bundle version ------- end

        # Generate github sha ------- start
        github_sha="${GITHUB_SHA:-${{ github.sha }}}"
        if [ ! -z "${WORKFLOW_GITHUB_SHA:-}" ]; then
          github_sha="$WORKFLOW_GITHUB_SHA"
        fi
        echo '$github_sha='$github_sha
        echo "GITHUB_SHA=$github_sha" >> $GITHUB_ENV
        # Generate github sha ------- end

        # Generate github tag ------- start
        source_ref_name="${SOURCE_REF_NAME:-}"
        github_ref="${GITHUB_REF:-${{ github.ref }}}"
        github_ref="${github_ref////-}"
        github_ref="${github_ref/refs-heads-/}"
        github_ref="${github_ref/refs-tags-/}"
        if [ ! -z "$source_ref_name" ]; then
          github_ref="$source_ref_name"
        elif [ ! -z "${WORKFLOW_GITHUB_REF_NAME:-}" ]; then
          github_ref="$WORKFLOW_GITHUB_REF_NAME"
        fi
        echo '$github_ref='$github_ref
        echo "GITHUB_TAG=$github_ref" >> $GITHUB_ENV
        # echo "::set-env name=GITHUB_TAG::$github_ref"
        # Generate github tag ------- end


    - name: Setup ENV BUILD_NUMBER to 1
      if: ${{ !github.event.workflow_run }}
      shell: bash
      run: |
        # Generate build number ------- start
        echo "BUILD_NUMBER=1" >> $GITHUB_ENV
        # Generate build number ------- end


    - name: Setup ENV BUILD_NUMBER by workflow_run
      if: ${{ github.event.workflow_run }}
      shell: bash
      run: |
        set -euo pipefail
        echo "ActionTriggerBy = ${{ github.event.action }} / ${{ github.event_name }}"
        if [ ! -z "${WORKFLOW_BUILD_NUMBER:-}" ]; then
          echo "BUILD_NUMBER=$WORKFLOW_BUILD_NUMBER" >> $GITHUB_ENV
        else
          # Generate build number ------- start
          run_created_at="${workflow_run_created_at:-}"
          if ! [[ "$run_created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            for attempt in 1 2 3; do
              run_created_at=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${workflow_run_id}" \
                --jq '.created_at // empty' 2>/dev/null || true)
              if [[ "$run_created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
                break
              fi
              sleep 2
            done
          fi
          if ! [[ "$run_created_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            echo "::error::Failed to resolve created_at for upstream workflow run ${workflow_run_id}"
            exit 1
          fi

          TODAY="${run_created_at:0:10}"
          FULL_DATE="${TODAY//-/}"

          if [ "${workflow_name:-}" = "daily-build-dev" ]; then
            CUTOVER_FLOOR=68
            DATE_PREFIX="1000${FULL_DATE:4:4}"
            ROLLOVER_PREFIX="10001119"
          else
            CUTOVER_FLOOR=4501
            DATE_PREFIX="${FULL_DATE}"
            ROLLOVER_PREFIX="20261119"
          fi

          if [ "${workflow_run_number}" -le "${CUTOVER_FLOOR}" ]; then
            run_number=$(( workflow_run_number % 100 ))
            run_number=$(printf "%02d" "$run_number")
            build_number="${DATE_PREFIX}${run_number}"
          else
            CREATED_RANGE="${TODAY}"
            MIN_RUN_FLOOR=0
            if [ "$FULL_DATE" = "20261118" ] || [ "$FULL_DATE" = "20261119" ]; then
              DATE_PREFIX="${ROLLOVER_PREFIX}"
              CREATED_RANGE="2026-11-18..2026-11-19"
              MIN_RUN_FLOOR="${CUTOVER_FLOOR}"
            fi

            min_run_today=""
            for attempt in 1 2 3; do
              min_run_today=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?created=${CREATED_RANGE}&per_page=100" \
                --jq "if any(.workflow_runs[]; .run_number == ${workflow_run_number}) then ([.workflow_runs[] | select(.run_number > ${MIN_RUN_FLOOR} and .run_number <= ${workflow_run_number}) | .run_number] | min // empty) else empty end" \
                2>/dev/null || true)
              if [[ "$min_run_today" =~ ^[0-9]+$ ]]; then
                break
              fi
              sleep 2
            done
            if ! [[ "$min_run_today" =~ ^[0-9]+$ ]]; then
              echo "::error::Failed to query workflow runs for ${CREATED_RANGE} (run #${workflow_run_number})"
              exit 1
            fi

            daily_seq=$(( workflow_run_number - min_run_today + 1 ))
            if [ "$daily_seq" -lt 1 ] || [ "$daily_seq" -gt 99 ]; then
              echo "::error::Daily build sequence (${daily_seq}) out of range 1..99 for ${DATE_PREFIX}"
              exit 1
            fi
            run_number=$(printf "%02d" "$daily_seq")
            build_number="${DATE_PREFIX}${run_number}"
          fi

          echo '$build_number='$build_number
          echo "BUILD_NUMBER=$build_number" >> $GITHUB_ENV
          # Generate build number ------- end
        fi
      env:
        GH_TOKEN: ${{ github.token }}
        workflow_id: ${{ github.event.workflow_run.workflow_id }}
        workflow_name: ${{ github.event.workflow_run.name }}
        workflow_run_id: ${{ github.event.workflow_run.id }}
        workflow_run_number: ${{ github.event.workflow_run.run_number }}
        workflow_run_created_at: ${{ github.event.workflow_run.created_at }}

    - name: Inject Environment Variables
      shell: bash
      env:
        COVALENT_KEY: ${{ inputs.covalent_key }}
        SENTRY_TOKEN: ${{ inputs.sentry_token }}
        SENTRY_PROJECT: ${{ inputs.sentry_project || '' }}
        TARGET_ENV_FILE: ${{ inputs.env_file_name || '.env' }}
        SENTRY_DSN_EXT: ${{ inputs.sentry_dsn_ext }}
        SENTRY_DSN_DESKTOP: ${{ inputs.sentry_dsn_desktop }}
        SENTRY_DSN_MAS: ${{ inputs.sentry_dsn_mas }}
        SENTRY_DSN_SNAP: ${{ inputs.sentry_dsn_snap }}
        SENTRY_DSN_WINMS: ${{ inputs.sentry_dsn_winms }}
        SENTRY_DSN_REACT_NATIVE: ${{ inputs.sentry_dsn_react_native }}
        SENTRY_DSN_WEB: ${{ inputs.sentry_dsn_web }}

      run: |
        echo "GITHUB_SHA=${{ env.GITHUB_SHA }}" >> ${TARGET_ENV_FILE}
        echo "GITHUB_TAG=${{ env.GITHUB_TAG }}" >> ${TARGET_ENV_FILE}
        echo "CI_BUILD_APP_VERSION=${{ env.BUILD_APP_VERSION }}" >> ${TARGET_ENV_FILE}
        echo "CI_BUILD_NUMBER=${{ env.BUILD_NUMBER }}" >> ${TARGET_ENV_FILE}
        echo "BUNDLE_VERSION=${{ env.BUILD_BUNDLE_VERSION }}" >> ${TARGET_ENV_FILE}
        # Disable bundle analyzer in CI environment to improve build performance
        # echo "ENABLE_ANALYZER=1" >> ${TARGET_ENV_FILE}
        # echo "ENABLE_ANALYZER_HTML_REPORT=1" >> ${TARGET_ENV_FILE}
        echo "COVALENT_KEY=${{ env.COVALENT_KEY }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_AUTH_TOKEN=${{ env.SENTRY_TOKEN }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_TOKEN=${{ env.SENTRY_TOKEN }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_PROJECT=${{ env.SENTRY_PROJECT }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_RELEASE_NAME=${{ env.GITHUB_TAG }}-${{ env.BUILD_NUMBER }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_DSN_EXT=${{ env.SENTRY_DSN_EXT }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_DSN_DESKTOP=${{ env.SENTRY_DSN_DESKTOP }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_DSN_MAS=${{ env.SENTRY_DSN_MAS }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_DSN_SNAP=${{ env.SENTRY_DSN_SNAP }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_DSN_WINMS=${{ env.SENTRY_DSN_WINMS }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_DSN_REACT_NATIVE=${{ env.SENTRY_DSN_REACT_NATIVE }}" >> ${TARGET_ENV_FILE}
        echo "SENTRY_DSN_WEB=${{ env.SENTRY_DSN_WEB }}" >> ${TARGET_ENV_FILE}
        echo "ONEKEY_ALLOW_SKIP_GPG_VERIFICATION=${{ env.ONEKEY_ALLOW_SKIP_GPG_VERIFICATION }}" >> ${TARGET_ENV_FILE}
        if [[ ! -z "${{ inputs.additional_env }}" ]]; then
          echo "${{ inputs.additional_env }}" >> ${TARGET_ENV_FILE}
        fi

    - name: Print ENV file content
      shell: bash
      run: |
