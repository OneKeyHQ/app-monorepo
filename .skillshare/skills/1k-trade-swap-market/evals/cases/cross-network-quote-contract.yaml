id: trade-cross-network-quote-contract
type:
  - golden
  - negative
  - verification
prompt: "Market 的 EVM→BTC 能报价，但 BTC→EVM 请求带了空的 toTokenAmount，修地址后 source=Market 又把 provider 过滤成 0。查回归来源并修复，不能破坏引入统一报价和 approved provider 的原需求。"
expected:
  must_include:
    - "inspect live Jira/Slack/PR history, current request payload, service serializer, and both cross-network directions"
    - "resolve source signer/account and target receiver/account independently and preserve them through quote, review, rebuild, signed build, analytics, and history"
    - "omit an absent optional amount instead of serializing an empty supplied value"
    - "inspect why the Market/provider filter was introduced and narrow any fallback to the proven capability boundary or report the server gap"
    - "verify both directions with focused tests and representative real request responses"
  must_not_include:
    - "reuse one address for sender and receiver across heterogeneous networks"
    - "remove the route source or approved-provider filter globally"
    - "claim a returned quote proves build, sign, send, or runtime UI success"
score:
  pass: 95
  critical_fail_if:
    - "breaks receiver identity or bypasses provider policy without a bounded evidence-based exception"
    - "skips live payload verification or fails to carry the address pair through an execution stage"
