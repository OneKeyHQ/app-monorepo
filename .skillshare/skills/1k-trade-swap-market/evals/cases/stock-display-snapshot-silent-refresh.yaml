id: stock-display-snapshot-silent-refresh
type:
  - golden
  - negative
  - verification
prompt: 'Stock Swap restores a stale-looking amount and chart on entry, then flashes skeletons while live data loads; account switches can briefly show the previous account. Design or review the fix without allowing cached data to unlock trading.'
expected:
  must_include:
    - 'name the target platform topology and separate the UI display-cache owner from ServiceSwap quote/build/execution ownership'
    - 'use one physical account slot with region owners: token detail account+stock+display currency, balance account+input token, chart account+stock+USD source, amount account+stock+pay+side, and selection account'
    - 'restore an exact matching first frame, refresh regions silently, retain matching display data on failure, and settle an exact live empty chart without returning to skeleton'
    - 'reject a mismatched region and every late patch in the same render after any field in that region owner changes'
    - 'keep cached amount, balance, market-open state, description, and chart out of editing, Max, percentage, balance validation, Review, quote, build, sign, and send decisions until the canonical live owner is ready'
    - 'keep chart visibleRange separate from requestedRange so retained data is never mislabeled during silent refresh'
    - 'route transitions across the Stock boundary through the centralized swap-type action so ordinary Swap amounts and balances are cleared before the Stock first frame'
    - 'require exact current-scope live execution balance plus matching shared-atom publication, with bounded retry, stale-scope cancellation, and explicit Retry'
    - 'cover malformed, future, expired, independent-TTL, eight-account eviction, 500-point endpoint-preserving downsample, extension no-op, and native main/bg ownership'
    - 'run the exact focused Jest lane and capture real first-frame, replacement, failure-retention, account-switch, and Review-unlock timing'
  must_not_include:
    - 'reuse shared SWR aggregate persistence as a second logical writer for the Stock display snapshot'
    - 'treat cached amount, balance, or token market metadata as live execution truth'
    - 'claim extension cross-restart restoration or runtime success from static tests'
score:
  pass: 90
  critical_fail_if:
    - 'a region from another account or region owner appears for one frame or patches the current owner later'
    - 'cached amount, balance, market state, or chart unlocks editing, Max, percentage, Review, quote, build, sign, or send'
    - 'a retained chart is labeled with requestedRange before that request commits'
    - 'an ordinary Swap amount or selected balance appears for one frame after entering Stock'
    - 'same-identity silent refresh performs a snapshot-to-skeleton-to-live round trip'
    - 'the implementation creates competing UI/service writers for the dedicated display cache'
