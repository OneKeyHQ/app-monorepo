id: trade-progressive-position-readiness
type:
  - golden
  - negative
  - verification
prompt: "iOS Trade 的 Swap/Stock/Pro 多网络持仓先显示整份旧缓存并置灰，慢网络让用户等 5 秒。要求当前页优先、其他页后台预取，哪个网络返回就显示哪个并立即可点；CI 还报 Native startup graph 超预算。"
expected:
  must_include:
    - "separate persisted display seed, authoritative per-network runtime results, request generation, and actionability"
    - "canonicalize the full owner key with locale-independent network ordering across every producer and consumer"
    - "use one bounded deduplicated queue, publish successful networks immediately, isolate failures, and persist only a complete successful snapshot"
    - "keep feature-only orchestration out of Native startup roots through a page-owned injected loader while preserving main atom and background proxy ownership"
    - "verify deterministic delayed/failed-network tests, real iOS behavior, commit checks, and the final Native startup graph artifact without raising the budget"
  must_not_include:
    - "render stale cached rows as current disabled positions"
    - "wait for every network before publishing successful results"
    - "use localeCompare for a persisted owner identity or persist partial runtime data as complete"
    - "move state ownership to background or raise the startup threshold"
score:
  pass: 95
  critical_fail_if:
    - "allows stale identity, blocks partial success, or claims startup success without the final artifact"
    - "persists incomplete runtime state as complete or raises the startup budget"
