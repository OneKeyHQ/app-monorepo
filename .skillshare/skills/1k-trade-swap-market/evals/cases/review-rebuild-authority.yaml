id: trade-review-rebuild-authority
type:
  - golden
  - negative
  - verification
prompt: "Review 里改滑点时 build-tx 已返回，但 fee 还在 loading；慢网下焦点变化会把 Review 关掉，旧请求回来又报 review changed。优化体验，但绝不能让用户提前 Confirm 旧或半成品交易。"
expected:
  must_include:
    - "trace the full rebuild owner from balance validation through executable snapshot, fee estimation, review publication, and Confirm"
    - "model request identity, executable readiness, fee readiness, error, and confirmation authority instead of one boolean"
    - "allow only the product-approved UI transition after the executable snapshot is safe while enforcing a second Confirm guard until fully ready"
    - "treat all rebuild phases as in-flight work for focus/host cleanup and reject stale generations"
    - "test delayed build and fee independently, focus loss, overlapping requests, and the real affected runtime"
  must_not_include:
    - "clear all loading when build-tx returns"
    - "rebuild only at Confirm as a hidden delay"
    - "let late work restore a cleared or different review"
score:
  pass: 95
  critical_fail_if:
    - "permits confirmation from stale or incomplete execution state"
    - "collapses readiness to one flag or omits the execution-boundary Confirm guard"
