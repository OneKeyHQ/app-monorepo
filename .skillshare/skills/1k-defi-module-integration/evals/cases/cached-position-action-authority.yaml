id: defi-cached-position-action-authority
type:
  - golden
  - negative
  - verification
prompt: "DeFi Portfolio 从本地缓存恢复了一条 position，但当前 supported-actions 请求还没完成，缓存里也缺 claim identity。页面应该怎么展示和验证，不能误导用户也不能把 position 隐藏掉。"
expected:
  must_include:
    - "separate cached position display, current supported-action capability, claim/config identity, and transaction builder validation"
    - "keep the position visible while withholding or disabling only the unproven action"
    - "resolve account, network, provider, vault/market, category, and source-position identity from current data without guessing from symbol or provider"
    - "reject stale capability results after owner change and fail closed when claim metadata remains ambiguous"
    - "verify an executable current-data path and a cached or ambiguous non-actionable path on the owning route"
  must_not_include:
    - "hide the position because no action is currently executable"
    - "enable an action from cache, provider name, or symbol alone"
    - "treat a successful build response as completed action or refreshed portfolio"
score:
  pass: 95
  critical_fail_if:
    - "invents action or claim identity from cached/ambiguous metadata"
    - "drops a valid visible position only because action readiness is unproven"
