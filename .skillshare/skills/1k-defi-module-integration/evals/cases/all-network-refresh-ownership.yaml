id: defi-all-network-refresh-ownership
type:
  - golden
  - negative
  - verification
prompt: "All Networks 的某个链在 DeFi 操作后先刷新完成。只更新这条链并保持其他协议和总览一致；期间切账号，旧事件不能写到新账户。"
expected:
  must_include:
    - "freeze account/indexed-account, network, protocol-map, currency, and request/event identity"
    - "remove and replace only the settled network slice for the matching owner, then recompute aggregates from the merged protocol map"
    - "preserve successful sibling networks and reject stale old-account events"
    - "keep position display, supported actions, transaction build, and refresh readiness as separate contracts"
    - "verify one network success, one sibling failure, account switch in flight, and final aggregate consistency"
  must_not_include:
    - "replace or clear the entire All Networks portfolio from one network event"
    - "use cached overview as proof that actions are currently executable"
    - "match imported, watching, or external accounts by wallet bucket alone"
score:
  pass: 95
  critical_fail_if:
    - "drops sibling data or accepts a stale/cross-account refresh"
    - "uses cached overview or one network event as complete action-ready portfolio truth"
