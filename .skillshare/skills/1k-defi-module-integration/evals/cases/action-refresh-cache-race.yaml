id: defi-action-refresh-cache-race
type:
  - golden
  - negative
  - verification
prompt: "DeFi action 成功后会立即刷新并定时重试，但用户切页触发的 foreground abort 可能取消刷新；两个账户同网络并发时，本地 overview 还可能被最后一个 address 覆盖。修复并验证。"
expected:
  must_include:
    - "trace action terminal, immediate refresh, delayed retry, foreground abort pool, persistence key, event payload, and visible consumer"
    - "key scheduled refresh by account and network and isolate it from UI abort ownership"
    - "persist the exact account address/xpub and network result directly or first repair the underspecified shared cache key"
    - "filter delivery by indexedAccountId when available, otherwise strict accountId, plus network for a single-network view"
    - "test concurrent accounts on one network, navigation abort, retry after index delay, and visible post-action refresh"
  must_not_include:
    - "share a network-only debounced cache write across accounts"
    - "treat wallet bucket identity as imported/watching/external account identity"
    - "claim action completion or refreshed positions from build success"
score:
  pass: 95
  critical_fail_if:
    - "loses post-action freshness or leaks one account's portfolio into another"
    - "shares UI cancellation or an underspecified cache writer with the background refresh"
