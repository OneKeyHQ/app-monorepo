# Bun configuration for OneKey app-monorepo

[install]
# Use hoisted linker for traditional node_modules structure with hoisting
# This ensures all packages are hoisted to top-level node_modules/
linker = "hoisted"
globalCache = false

# Enable deduplication for monorepo workspaces
deduplicateDependencies = true

[resolve]
# Prefer CommonJS over ESM for better Metro bundler compatibility
prefer = "cjs"
